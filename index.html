  if(field && control && field!==control){
    const body=[...field.children].filter(n=>n.tagName!=="H3").map(n=>n.outerHTML).join("");
    if(body) control.insertAdjacentHTML("beforeend",`<div class="merged-fieldpoints"><b>現場確認</b>${body}</div>`);
    field.remove();
  }

  // Legal classification must be first, then practical meaning.
  const current=[...root.querySelectorAll(".section")];
  const label=sec=>(sec.querySelector("h3")?.textContent||"").trim();
  const rank=sec=>{
    const h=label(sec);
    if(h.includes("法令区分")) return 10;
    if(h.includes("要点解説")) return 20;
    if(h.includes("重要な数値・基準")||h.includes("規制値")) return 30;
    if(h.includes("対象になる条件")||h.includes("適用条件")) return 40;
    if(h.includes("判定フロー")||h.includes("まずこの順で確認")) return 50;
    if(h.includes("実務判断・具体例")||h.includes("よくある判断質問")) return 60;
    if(h.includes("作業前の管理")||h.includes("作業前の重要確認")) return 70;
    if(h.includes("教育・講習・資格")) return 80;
    if(h.includes("作業前・提出時に確認する書類")||h.includes("必要書類")) return 90;
    if(h.includes("提出先・相談先")) return 100;
    if(h.includes("点検")||h.includes("期限")||h.includes("記録・保存")) return 110;
    if(h.includes("異常・緊急時")) return 120;
    if(h.includes("条文要旨")||h.includes("条文・条文番号")) return 130;
    if(h.includes("一次資料")||h.includes("関連条文")) return 140;
    if(h.includes("根拠・更新確認")||h.includes("根拠・確認状況")) return 900;
    if(h.includes("共有・印刷")||h.includes("会議・説明用")) return 910;
    if(h.includes("誤り・改正")) return 920;
    return 500;
  };
  const anchor=current[0]?.parentElement;
  if(anchor){
    current.sort((a,b)=>rank(a)-rank(b)).forEach(sec=>anchor.appendChild(sec));
  }

  // Simplify top quick navigation to the things used under time pressure.
  const nav=root.querySelector(".quick-nav");
  if(nav){
    nav.innerHTML="";
    const navItems=[
      ["要点解説","要点"],
      ["重要な数値・基準","数値・基準"],
      ["対象になる条件","適用条件"],
      ["判定フロー","判定"],
      ["実務判断・具体例","具体例"],

      const sec=[...root.querySelectorAll(".section")].find(v=>(v.querySelector("h3")?.textContent||"").includes(needle));

        const b=document.createElement("button");
        b.textContent=labelText;

        nav.appendChild(b);
      }
    });
  }

  // Hide the old summary card: it duplicated legal/status information and harmed hierarchy.
  root.querySelectorAll(".detail-summary").forEach(v=>v.remove());
}

function rebuildDetailForFieldUse(){
  const root=document.querySelector("#detail");
  if(!root)return;
  let sections=[...root.querySelectorAll(".section")];
  const heading=sec=>(sec.querySelector("h3")?.textContent||"").trim();

  // 1. Hard-remove sections the field user does not need.
  sections.forEach(sec=>{
    const h=heading(sec);
    if(
      h.includes("根拠・確認状況") || h.includes("根拠・更新確認") ||
      h.includes("このテーマで使える実務ガイド") ||
      h.includes("よくある判断質問") || h.includes("実務判断・具体例") ||
      h.includes("誰が何をする") || h.includes("誰が何を確認") ||
      h.includes("その他の関連条文") ||
      h.includes("点検・検査・保存期間早見表") ||
      h.includes("現場で確認するポイント") || h.includes("作業前の重要確認")
    ) sec.remove();
  });

  sections=[...root.querySelectorAll(".section")];

  // 2. Rename and simplify headings.
  sections.forEach(sec=>{
    const h=sec.querySelector("h3"); if(!h)return;
    const t=h.textContent.trim();
    if(t.includes("条文・条文番号")) h.innerHTML='条文 <span class="field-inline-note">※要旨です。原文は公式資料で確認</span>';
    else if(t.includes("規制値・基準値・期限")||t.includes("重要な数値・基準")) h.textContent="重要な数値・基準";
    else if(t.includes("適用条件・境界・例外チェック")||t.includes("対象になる条件・ならない条件")) h.textContent="適用条件";
    else if(t.includes("30秒判定フロー")||t.includes("判定フロー")) h.textContent="判定";
    else if(t.includes("必要書類・証憑チェック")||t.includes("作業前・提出時に確認する書類")) h.textContent="作業前に確認する書類";
    else if(t.includes("教育・講習・資格の確認")||t.includes("必要な資格・教育")) h.textContent="必要な資格・教育";
    else if(t.includes("会議・説明用に共有")||t.includes("共有・印刷")) h.textContent="会議・説明用に共有";
    else if(t.includes("誤り・改正を報告")||t.includes("誤り・改正の報告")) h.textContent="誤り・改正を報告（現時点で送付先未設定）";
  });

  // 3. Remove verbose article warning boxes and duplicate "not original" labels.
  root.querySelectorAll("*").forEach(el=>{
    const t=(el.textContent||"").trim();
    if(
      t.startsWith("表示文は条文の要旨です。") ||
      t.startsWith("※上記に表示した条文は、下の「その他の関連条文」") ||
      t==="条文要旨（原文ではありません）"
    ){
      if(el.closest(".section") && el.children.length===0) el.remove();
      else if(el.children.length===0) el.remove();
    }
  });

  // 4. Legal classification: only the useful line; remove explanatory boilerplate.
  sections=[...root.querySelectorAll(".section")];
  const legal=sections.find(sec=>heading(sec).includes("法令区分"));

  // 5. Remove old "developer-facing" qualification explanation.
  root.querySelectorAll("*").forEach(el=>{
    const t=(el.textContent||"").trim();
    if(el.children.length===0 && (
      t.startsWith("時間数を断定できるものだけ具体値を表示") ||
      t.startsWith("作業前・検査前・届出時に、何の書類を確認するか")
    )) el.remove();
  });

  // 6. Put label/context before metric values where the current cards can be inferred.
  const metricSec=[...root.querySelectorAll(".section")].find(sec=>(sec.querySelector("h3")?.textContent||"").includes("重要な数値・基準"));
  if(metricSec){
    const cards=[...metricSec.querySelectorAll(".metric")];
    cards.forEach(card=>{
      const texts=[...card.querySelectorAll("*")].filter(e=>e.children.length===0).map(e=>e.textContent.trim()).filter(Boolean);
      const all=card.textContent.trim();
      let label="",value="",context="";
      const val=texts.find(t=>/^(?:約|おおむね)?\d|時間|日|年|月|m|ppm|dB/i.test(t)) || texts[0] || "";

      else if(/3分間以上/.test(all)){label="といし取替え時の試運転";value="3分間以上";context="研削といしを取り替えたとき";}
      else if(/3年間/.test(all)&&/特別教育/.test(all)){label="特別教育記録";value="3年間";context="保存期間";}
      else if(/機械研削/.test(all)&&/学科7時間/.test(all)){label="機械研削用といしの特別教育";value="学科7時間＋実技3時間";context="教育時間";}
      else if(/自由研削/.test(all)&&/学科4時間/.test(all)){label="自由研削用といしの特別教育";value="学科4時間＋実技2時間";context="教育時間";}
      if(label){

      }
    });
  }

  // 7. Strict field-use order. Article is deliberately below practical decision data.
  sections=[...root.querySelectorAll(".section")];
  const rank=sec=>{
    const h=(sec.querySelector("h3")?.textContent||"").trim();
    if(h.includes("法令区分"))return 10;

    if(h.includes("作業前に確認する書類"))return 80;
    if(h.includes("提出先・相談先"))return 90;
    if(h.includes("異常・緊急時"))return 100;
    if(h.startsWith("条文"))return 200;
    if(h.includes("一次資料"))return 210;
    if(h.includes("会議・説明用に共有"))return 900;
    if(h.includes("誤り・改正"))return 910;
    return 300;
  };
  const parent=sections[0]?.parentElement;
  if(parent) sections.sort((a,b)=>rank(a)-rank(b)).forEach(sec=>parent.appendChild(sec));

  // 8. Styling classes after final ordering.
  [...root.querySelectorAll(".section")].forEach(sec=>{
    const h=(sec.querySelector("h3")?.textContent||"");
    if(/法令区分|要点解説|重要な数値・基準|適用条件|判定/.test(h))sec.classList.add("field-primary");
    else if(/会議・説明用|誤り・改正/.test(h))sec.classList.add("field-admin");
    else sec.classList.add("field-secondary");
  });

  // 9. Quick nav: only decision-relevant destinations.
  const nav=root.querySelector(".quick-nav");
  if(nav){
    nav.innerHTML="";
    [["法令区分","法令区分"],["要点解説","要点"],["重要な数値・基準","数値・基準"],["適用条件","適用条件"],["判定","判定"],["必要な資格・教育","資格・教育"],["条文","条文"]].forEach(([needle,label])=>{
      const sec=[...root.querySelectorAll(".section")].find(v=>(v.querySelector("h3")?.textContent||"").includes(needle));
      if(sec){const b=document.createElement("button");b.textContent=label;b.onclick=()=>sec.scrollIntoView({behavior:"smooth",block:"start"});nav.appendChild(b)}
    });
  }
}

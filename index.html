/* v115 visual hierarchy upgrade */
:root{
  --ui-card:#ffffff;
  --ui-soft:#f6f8fa;
  --ui-line:#dbe4e8;
  --ui-text:#1f2d33;
  --ui-muted:#6a7b84;
}
body{background:linear-gradient(180deg,#f4f7f9 0,#eef3f5 100%);color:var(--ui-text)}
.wrap,.container,.main{max-width:1180px;margin-left:auto;margin-right:auto}
.header,.topbar{box-shadow:0 8px 26px rgba(31,45,51,.08)}
.card,.result,.section,.governancepanel{
  border:1px solid var(--ui-line)!important;
  box-shadow:0 7px 22px rgba(41,61,71,.06);
}
.card,.result,.section{border-radius:16px!important}
.section{background:var(--ui-card);padding:16px!important;margin:12px 0!important}
.section h3{
  display:flex;align-items:center;gap:8px;
  margin:0 0 11px!important;
  font-size:13px!important;line-height:1.35;
  letter-spacing:.01em;
}
.section h3:before{
  content:"";display:block;width:5px;height:18px;border-radius:999px;
  background:currentColor;opacity:.35;
}
.sourcenote,.note,.small,.muted{color:var(--ui-muted)!important}
.badge,.chip,.tag,.featurebadge,.coverageinline b,.coverageinline span{
  border-radius:999px!important;
}
.detail-hero{
  border:1px solid var(--ui-line);
  background:linear-gradient(180deg,#fff 0,#f9fbfc 100%);
  border-radius:18px;padding:18px;margin:12px 0 16px;
  box-shadow:0 10px 30px rgba(41,61,71,.08);
}
.detail-hero .eyebrow{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--ui-muted);text-transform:uppercase}
.detail-hero h2{font-size:22px;line-height:1.35;margin:5px 0 8px}
.detail-hero .desc{font-size:11px;line-height:1.75;color:#50636d}
.detail-grid{
  display:grid;grid-template-columns:1.35fr .65fr;gap:12px;align-items:start;
}
.detail-main,.detail-side{min-width:0}
.detail-side{position:sticky;top:12px}
.detail-side .section{padding:13px!important}
.quick-nav{
  display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;
}
.quick-nav button{
  border:1px solid var(--ui-line);background:#fff;border-radius:999px;
  padding:6px 9px;font-size:9px;font-weight:800;
}
.section.priority{border-width:2px!important}
.section.priority h3{font-size:14px!important}
.section .metric,.section .deadline,.section .record,.section .question{
  background:var(--ui-soft);border:1px solid #e2e8eb;border-radius:10px;padding:9px;margin:6px 0;
}
.result{
  background:#fff!important;
  padding:14px!important;
  transition:transform .12s ease,box-shadow .12s ease;
}
.result:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(41,61,71,.09)}
.result h3,.result .title{font-size:14px!important;line-height:1.45}
.result .meta{font-size:9px;color:var(--ui-muted)}
.filters,.filterbar{
  background:#fff;border:1px solid var(--ui-line);border-radius:14px;
  padding:10px;box-shadow:0 6px 18px rgba(41,61,71,.05);
}
select,input[type="search"],input[type="text"]{
  border-radius:10px!important;border:1px solid #d7e1e6!important;
}
@media(max-width:860px){
  .detail-grid{grid-template-columns:1fr}
  .detail-side{position:static}
  .detail-hero h2{font-size:19px}
}

.toolbar{display:grid!important;grid-template-columns:auto 1fr!important;gap:12px!important;align-items:center!important}
.toolbarhead{display:flex;align-items:baseline;gap:8px}

const POINT_HELP={"酸素濃度":"入槽・入坑前だけでなく、再入場時や異常時など必要なタイミングで測定。測定位置や測定方法も確認する。","硫化水素":"第二種酸素欠乏危険作業では硫化水素も管理対象。臭いの有無だけでは判断しない。","換気":"送風機の能力・吸排気位置・ダクト配置を確認し、作業場所全体を安全な濃度に維持する。","作業主任者":"必要な技能講習修了者が選任され、名目だけでなく作業方法の決定・濃度測定・設備点検・監視を実施しているか確認。","救出体制":"監視人、連絡方法、空気呼吸器等、はしご・ロープ等の救出用具を事前に準備。無防備な二次災害救助を防ぐ。","機種":"クレーン、移動式クレーン等の種類を確認。資格・検査・安全装置の規定が変わる。","つり上げ荷重":"資格区分や適用規定を判断する基本値。機械の定格荷重と混同しない。","運転資格":"機種とつり上げ荷重に応じ、免許・技能講習・特別教育のどれが必要か確認。","アウトリガー":"張出し状態、地盤支持、敷板、障害物、沈下のおそれを確認。","定格荷重":"作業半径・ブーム長等に応じた定格荷重内か確認。","玉掛け資格":"つり上げ荷重に応じて技能講習又は特別教育の要否を確認。","吊具の状態":"ワイヤ、スリング、シャックル、フック等の損傷・変形・摩耗・使用荷重を確認。","荷の重心":"吊り荷の重心と玉掛け位置を確認し、傾き・荷崩れ・抜けを防止。","合図者":"運転者と玉掛け作業者の合図方法・合図者を明確にする。","吊り荷下の立入":"吊り荷の落下・振れ・挟まれの危険範囲へ人を入れない。","作業床幅":"現場で実測し、法定寸法を満たすか確認。","床材の隙間":"足先・工具の落下やつまずきにつながる隙間を確認。","手すり・中さん":"欠損、取り外し、仮復旧、強度不足がないか確認。","足場点検":"組立て・変更後や悪天候後など、必要な点検が実施・記録されているか確認。","作業高さ":"床面から作業位置までの高さだけでなく、実際に墜落する高さ・開口部も確認。","作業床の有無":"安定した作業床があるか。困難な場合の代替墜落防止措置も確認。","開口部・端部":"手すり、覆い、囲い等の欠損・取り外し箇所を確認。","墜落制止用器具":"必要な場合、適切な器具・取付設備・使用方法になっているか確認。","設置角度・安定":"使用前に設置面が水平・堅固か、脚部が開き切っているか、転倒・ぐらつきがないか確認します。","滑り止め":"脚部・接地面の滑り止めが有効か、油・水・粉じん等で滑りやすくなっていないか確認します。","破損":"亀裂、曲がり、摩耗、緩み、腐食など使用に影響する損傷がないか確認します。","天板使用の有無":"天板に乗る使用や跨ぎ使用をしていないか、製品表示・取扱説明に反していないか確認します。","特別教育":"特別教育の対象者、内容、実施時期、記録が要求に合っているか確認します。","作業手順":"作業手順について、現物・記録・作業方法を確認し、法令上又は現場ルール上の要求を満たしているか確認します。","材料点検":"材料点検について、実施時期・対象項目・記録・異常時の措置を確認します。","作業計画":"機械能力、作業範囲、経路、周囲設備、人員配置、危険箇所を事前に整理した計画があるか確認します。","運行経路":"走行経路の幅員、勾配、路肩、交差部、歩行者動線、障害物を確認します。","立入禁止又は誘導者":"接触危険箇所を立入禁止にしているか、必要な場合は誘導者を配置して合図方法を統一しているか確認します。","路肩・地盤":"路肩崩壊、軟弱地盤、段差、沈下のおそれを確認し、転倒・転落防止措置を確認します。","停止時の措置":"運転位置を離れる際に作業装置を下ろし、原動機停止、逸走防止等が行われているか確認します。","平坦で堅固な場所":"積卸し場所が平坦で十分な強度を持ち、車両や機械が沈下・傾斜しないか確認します。","道板の強度・幅":"道板の強度・幅・長さ・勾配が対象機械に適しているか、確実に固定されているか確認します。","誘導":"誘導者の位置、合図方法、運転者との視認性を確認し、第三者が進入しないよう管理します。","歩行者との分離":"車両動線と歩行者動線が物理的又は運用上分離されているか確認します。","積荷の安定":"荷崩れ、偏荷重、過積載、視界遮断がないか確認します。","死角":"交差部・後退時・荷による視界不良など死角を洗い出し、ミラー・誘導者等の対策を確認します。","重量・形状":"重量、重心、持ちにくさ、長尺物かどうかを確認し、人力で安全に扱えるか判断します。","運搬人数":"一人で無理な重量・形状でないか、必要人数を確保して役割と合図を決めているか確認します。","補助具":"台車、リフター、吊具等の補助具を使えるか、能力・状態が適切か確認します。","経路":"段差、階段、狭所、滑りやすい床、障害物を確認し、安全な運搬経路を確保します。","挟まれ箇所":"荷と壁・設備・車両等の間に手足や身体を挟む箇所がないか確認します。","作業半径":"クレーンの作業半径と定格荷重の関係、周囲障害物、アウトリガー設置条件を確認します。","検査証":"対象機械・設備の検査証が有効で、機番・能力等が現物と一致しているか確認します。","有効期間":"検査証、資格、教育等に有効期限や更新条件がある場合、期限切れでないか確認します。","定期自主検査記録":"法定周期の点検・検査記録が残っているか、異常時の補修記録まで確認します。","作業開始前点検":"その日の使用開始前に必要な機能・安全装置・損傷の有無を確認します。","SDS":"最新版SDSで危険有害性、成分、保護具、応急措置、保管方法等を確認します。","物質名・含有率":"製品名だけでなく、規制対象物質名と含有率をSDS等で確認します。","屋内外":"屋内・屋外・タンク内等の作業場所によって換気・保護具等の要求が変わらないか確認します。","換気設備":"局所排気、プッシュプル、全体換気等が適切に設置・稼働し、点検されているか確認します。","呼吸用保護具":"物質・濃度・作業条件に合う種類か、面体の適合、吸収缶・フィルタの管理を確認します。","CAS番号":"同名・類似名の物質を誤認しないよう、SDSのCAS番号で対象物質を確認します。","含有率":"混合物の規制適用に関わる含有率をSDSや成分表で確認します。","用途":"塗装、洗浄、脱脂、接着等の用途と実際の作業内容が規制対象に当たるか確認します。","作業方法":"吹付け、刷毛塗り、浸漬、加熱、研磨等、ばく露の大きさに影響する方法を確認します。","対象物質区分":"第1類・第2類・第3類等、法令上の区分と個別規制を確認します。","設備":"囲い式、局所排気、密閉化、安全装置等、必要な設備が設けられているか確認します。","測定・健診":"作業環境測定や特殊健康診断の対象・頻度・記録が適切か確認します。","ラベル":"容器・包装の名称、危険有害性、注意事項等の表示が適切か確認します。","リスクアセスメント":"危険有害性を特定し、リスクを見積り、低減措置を実施・記録しているか確認します。","ばく露低減措置":"代替、密閉化、局排、作業時間短縮、保護具の順で低減策を検討しているか確認します。","管理者":"法令上必要な管理者・責任者が選任され、職務・権限・氏名周知が明確か確認します。","事前調査":"工事前に設計図書・現地確認等で対象物の有無を調べ、調査結果を記録しているか確認します。","報告対象規模":"面積・請負金額・設備規模等が届出・報告の対象基準に該当するか確認します。","含有の有無":"分析結果・SDS・設計資料等で対象物質を含むか明確に確認します。","隔離・湿潤化":"飛散防止のための隔離、養生、湿潤化等が作業条件に応じて実施されているか確認します。","作業種類":"切断、研磨、破砕、溶接等、粉じん・有害物が発生する作業種類を確認します。","粉じん発生源":"どこでどの程度粉じんが発生するかを確認し、発生源対策が可能か確認します。","局排・集じん":"発生源に近い位置で有効に吸引できているか、ダクト・フィルタ等の状態も確認します。","防じんマスク":"粉じん種類・濃度に適した区分か、フィット、フィルタ交換、保管状態を確認します。","健診":"対象業務に応じた一般・特殊健康診断の実施時期、結果、事後措置を確認します。","鉛含有の有無":"塗膜・材料・粉じん等に鉛が含まれるか、分析結果やSDSで確認します。","局排":"局所排気装置の設置、吸引性能、点検・定期自主検査の実施状況を確認します。","保護具":"危険有害要因に合う保護具か、数量、状態、着用方法、交換・清潔保持を確認します。","隔離・縁切り":"配管・電源・駆動源等を確実に遮断し、誤投入・流入が起きない状態か確認します。","残留物":"内容物・残留ガス・スラッジ等が残っていないか、必要に応じ洗浄・置換を確認します。","ガス測定":"酸素、可燃性ガス、有毒ガス等を作業前・必要時に測定し、測定器の校正も確認します。","監視・救出":"監視人、連絡手段、救出器具、退避方法、緊急時の役割分担を確認します。","火気許可":"客先・現場ルールで火気作業許可が必要か、許可条件と有効時間を確認します。","可燃物除去・養生":"周囲の可燃物を除去・隔離し、火花飛散範囲を養生しているか確認します。","消火器":"火災の種類に適した消火設備が近くにあり、すぐ使用できる状態か確認します。","ガス・危険物":"可燃性ガス、危険物、可燃性残留物がないか、必要に応じ測定・除去を確認します。","作業後の残火確認":"作業終了後も一定時間周囲を確認し、火種・高温部・くすぶりがないか確認します。","施設区分":"製造所・貯蔵所・取扱所等、消防法上の施設区分を確認します。","危険物残存":"設備・配管内に危険物が残っていないか、抜取り・洗浄・ガスフリーを確認します。","変更許可・仮使用":"工事内容が変更許可、届出、仮使用承認等のどれに該当するか所轄消防と確認します。","火気管理":"火気使用範囲、可燃物除去、ガス測定、消火設備、監視体制を確認します。","工事責任者":"工事の責任者、危険物施設側の立会者、連絡体制を明確にします。","電源隔離":"対象電路を確実に開路し、誤投入防止措置を行っているか確認します。","検電":"適切な検電器で無電圧を確認し、使用前後の検電器機能確認も行います。","接地":"高圧・特別高圧等で必要な短絡接地が確実に行われているか確認します。","LOTO":"施錠・表示・個人錠等により、作業中の誤操作・再投入を防止しているか確認します。","主任技術者・保安規程":"電気保安に関する主任技術者の体制と保安規程に沿った運用を確認します。","主任技術者":"選任・外部委託承認等の体制が適切か、担当範囲・連絡先を確認します。","保安規程":"使用開始前の届出、変更履歴、実際の点検・運用との整合を確認します。","工事開始前の体制":"工事責任者、主任技術者、作業指揮、停電範囲、連絡体制を事前に確認します。","巡視点検":"法令・保安規程・社内基準に基づく巡視点検が実施・記録されているか確認します。","自主検査":"法定又は保安上必要な自主検査の周期、記録、異常時措置を確認します。","ガス種・圧力":"ガスの種類、常用圧力、設計圧力、温度条件を確認し、適用基準を特定します。","設備区分":"特定設備・第二種特定設備等、法令上の設備区分を確認します。","耐圧・気密試験":"適用基準に沿った試験圧力、媒体、保持時間、漏えい確認、安全措置を確認します。","完成検査":"設置・変更後に必要な完成検査の対象、時期、合格前使用の可否を確認します。","保安検査":"定期保安検査の対象設備か、周期、記録、次回期限を確認します。","種類・能力":"設備種類、能力、容量、圧力等から法令区分・必要資格・検査対象を確認します。","安全弁":"設定圧力、封印・調整状態、吹出し経路、定期確認の実施状況を確認します。","圧力計・水面計":"指示値、最高使用圧力表示、コック類、詰まり、損傷、機能点検を確認します。","資格":"作業に必要な免許・技能講習・特別教育等が有効か確認します。","容器区分":"第一種・第二種等の区分を内容物、圧力、容量等から確認します。","内容物":"蒸気、ガス、液体の種類と危険性、腐食性等を確認します。","圧力・容量":"最高使用圧力、内容積等から法令区分・検査対象を確認します。","安全装置":"安全弁、逃し装置、インターロック等の設定・機能・点検状態を確認します。","資格・検査":"取扱資格、検査証、有効期限、定期自主検査の実施状況を確認します。","指定地域":"騒音・振動規制法の指定地域内か、自治体の区域指定を確認します。","対象作業":"使用機械・作業方法が政令で定める特定建設作業に該当するか確認します。","開始日":"届出期限から逆算し、実際の作業開始日を正確に確認します。","届出":"届出先、期限、様式、添付図書、変更時の扱いを確認します。","近隣対策":"作業時間、周知、苦情窓口、防音・防振措置など周辺影響対策を確認します。","廃棄物種類":"産業廃棄物・特別管理産業廃棄物等の区分と品目を確認します。","保管":"保管場所、表示、飛散・流出防止、保管基準への適合を確認します。","委託先許可":"収集運搬・処分業者の許可品目、許可区域、有効期限を確認します。","契約":"委託契約書の法定記載事項、許可証写し、契約期間を確認します。","マニフェスト":"交付、返送確認、期限管理、保存、年度報告を一連で確認します。","地質・地盤":"土質、湧水、埋設物、周辺荷重、亀裂等を事前に確認します。","掘削深さ":"掘削深さから作業主任者・土止め・勾配等の必要条件を確認します。","法面":"勾配、亀裂、浮石、湧水、崩壊兆候を確認します。","土止め":"土止め支保工の設計・設置・変形・緩み・点検状態を確認します。","立入禁止":"危険区域を明確に区画し、不要な者が入らない措置を確認します。","組立図":"構造、部材寸法、支柱間隔、荷重条件等が示された組立図があるか確認します。","支柱":"支柱の沈下・座屈・継手・固定・水平つなぎ等を確認します。","地盤":"支持力、沈下、傾斜、水の影響を確認し、必要な敷板等を確認します。","打設計画":"打設順序、速度、荷重集中、監視方法を確認します。","といしの状態":"亀裂、欠け、摩耗、表示、適合寸法、最高使用周速度を確認します。","保護カバー":"覆いが正しく取り付けられ、必要範囲を防護しているか確認します。","回転方向":"といし・工具の回転方向と飛散方向を確認し、身体位置を避けます。","飛散防護":"火花・切粉・破片が人や設備に当たらないよう遮へい・保護具を確認します。","危険部分の覆い":"回転部・刃部・駆動部等への接触防止ガードが有効か確認します。","非常停止":"非常停止装置の位置、機能、復帰方法を確認します。","清掃・調整時停止":"清掃・調整・詰まり除去時に停止・エネルギー遮断が行われるか確認します。","再起動防止":"点検・清掃中に第三者が起動できないよう施錠・表示等を確認します。","作業リスク":"飛来、切創、化学物質、騒音、墜落等の危険有害要因を洗い出します。","適切な種類":"危険有害要因に合う規格・性能の保護具を選定しているか確認します。","破損・期限":"損傷、劣化、使用期限、交換時期を確認します。","正しい着用":"サイズ、装着位置、締付け、フィット等が正しいか確認します。","管理責任":"保護具の選定・保守・教育・在庫管理の責任者を明確にします。","作業内容":"実際に行う作業を具体化し、法令上の資格対象に該当するか確認します。","必要資格":"免許・技能講習・特別教育のどれが必要か、能力・荷重等の境界値で確認します。","修了証":"本人の修了証・免許証と氏名・対象業務を確認します。","有効な教育":"教育内容・時間・対象者が法令要求を満たしているか確認します。","記録":"教育・点検・測定・検査等の記録が必要期間保存されているか確認します。","必要な主任者":"対象作業・規模・物質等から作業主任者の選任要否を確認します。","選任表示":"作業主任者等の氏名・職務が現場で分かるよう周知されているか確認します。","職務":"法令で定める作業主任者・管理者の職務が実際に遂行されているか確認します。","初任時教育":"新たに職長等へ就く者に必要な教育を受けているか確認します。","再教育":"能力向上教育や社内再教育の要否・実施状況を確認します。","監督方法":"作業手順の指示、配置、巡視、是正の方法を確認します。","異常時措置":"異常・災害時の停止、退避、連絡、救急対応を確認します。","元方・関係請負人":"元方と各請負人の責任範囲、連絡窓口、指示系統を確認します。","選任者":"必要な安全衛生関係者が適切に選任され、資格・人数が満たされているか確認します。","協議会":"協議組織の開催、参加者、議題、記録を確認します。","作業間調整":"同時作業の干渉・危険を洗い出し、工程・区域・合図等を調整します。","巡視":"法令・現場ルールに基づく巡視頻度、指摘、是正を確認します。","業種":"業種区分によって選任義務・人数基準が変わるため正しく分類します。","常時使用労働者数":"事業場の常時使用労働者数を確認し、選任・委員会要件を判定します。","必要選任者":"総括安全衛生管理者、安全管理者、衛生管理者、産業医等の要否を確認します。","委員会":"安全委員会・衛生委員会等の設置要否、開催、議事記録を確認します。","設備・工事の種類":"対象設備・工事が法令上の届出対象区分に入るか確認します。","規模":"能力・容量・面積・金額等の規模要件を確認します。","工事開始日":"法定届出期限から逆算し、開始予定日を確認します。","提出先":"所轄労働基準監督署、自治体、消防等、正しい提出先を確認します。","必要図書":"図面、計算書、工程表、資格証等の添付書類を確認します。","被災状況":"発生日時、場所、作業内容、傷病部位、原因等を正確に整理します。","休業日数":"休業見込日数を確認し、報告区分・期限を判断します。","報告期限":"法定の提出時期を確認し、遅延しないよう管理します。","所轄署":"事業場を管轄する労働基準監督署等を確認します。","再発防止":"原因分析後、設備・手順・教育・管理面の再発防止策を実施します。","WBGT・暑熱":"WBGT、気温、湿度、直射日光、発熱源等を確認します。","体調":"既往、睡眠、飲酒、体調不良、暑熱順化等を作業前に確認します。","報告体制":"異常者を発見した際の連絡先・報告方法を全員に周知します。","離脱・冷却":"症状があれば直ちに作業離脱し、涼しい場所で身体冷却・水分補給等を行います。","救急手順":"意識障害等の重症兆候時の救急要請、搬送先、付き添いを決めておきます。","対象作業場":"法令で作業環境測定が必要な作業場に該当するか確認します。","測定対象":"対象物質・騒音等、何を測定する必要があるか確認します。","測定頻度":"個別規則で定める測定周期と次回期限を確認します。","評価":"測定結果の管理区分・評価結果と改善措置を確認します。","従事業務":"健康診断の対象となる有害業務に従事しているか確認します。","対象物質":"特殊健診対象物質・業務に該当するか確認します。","対象者":"雇入れ、配置替え、常時従事等の対象者要件を確認します。","実施時期":"雇入れ時、配置替え時、定期等の実施時期を確認します。","作業時間":"1日のばく露時間・連続作業時間を把握します。","騒音・振動レベル":"測定値と作業時間からばく露の大きさを確認します。","健康管理":"健診結果、聴力・末梢循環等の変化、事後措置を確認します。","工事内容・金額":"工事種類、請負金額、下請代金総額を確認します。","元請下請":"元請・下請の立場と施工体制を確認します。","必要技術者":"主任技術者・監理技術者・専任要否を条件から確認します。","施工体制台帳":"作成義務の有無、記載内容、下請情報の更新を確認します。","危険源":"機械、物質、作業方法、環境から危険有害要因を洗い出します。","誰が被災するか":"作業者だけでなく周辺作業者・第三者も含めて対象者を特定します。","重篤度・可能性":"結果の重さと発生可能性からリスクを見積もります。","低減措置":"本質安全化、工学的対策、管理的対策、保護具の順で低減策を検討します。","残留リスク":"対策後も残るリスクを明示し、作業者へ周知します。","入構教育":"客先・構内固有の禁止事項、緊急時、連絡先、保護具等を確認します。","作業許可":"火気、閉所、停電、掘削等の作業許可が必要か確認します。","火気・閉所許可":"現場独自の火気・閉所作業許可の条件、期限、立会要件を確認します。","ローカルルール":"法令とは別に客先・構内で定める最新ルールを確認します。"};
const PURPOSE={"酸素欠乏・閉所":"酸素欠乏症等防止規則は、タンク、ピット、マンホール、槽、サイロなど、酸素不足や硫化水素中毒が起こり得る場所で作業する人を守るための規則です。危険場所の把握、作業前の濃度測定、換気、作業主任者の選任、特別教育、監視、退避・救出体制、呼吸用保護具までを一連で規制します。単に『酸素濃度が18%以上なら入ってよい』という規則ではなく、作業中も安全な雰囲気を維持し、異常時に直ちに退避・救出できる管理体制まで求めるものです。","クレーン・移動式クレーン":"クレーン等安全規則は、クレーンや移動式クレーンによる吊り上げ作業で、過負荷、転倒、吊り荷の落下、接触・挟まれ等を防止するための規則です。機械の種類・つり上げ荷重に応じた運転資格、定格荷重、安全装置、作業方法、点検・検査などを規制します。","玉掛け・吊具":"玉掛けでは、吊り荷を安全にクレーンへ掛け外しするため、作業者の資格・教育、ワイヤロープやスリング等の吊具、荷の重心、合図、作業開始前点検などが規制されます。『吊る機械』だけでなく『荷をどう掛けるか』が独立した重要管理項目です。","足場・作業床":"足場に関する規定は、高所作業中の墜落・転落と、足場材・工具等の落下を防ぐため、作業床の寸法、床材の隙間、手すり等の墜落防止設備、足場の組立て・解体・点検等を具体的に規制します。","墜落・高所作業":"労働安全衛生規則では、高さのある場所からの墜落・転落を防ぐため、作業床、手すり・覆い等の設備、墜落制止用器具等について規定しています。『高さ2m』は重要な基準ですが、2m未満なら何をしてもよいという意味ではなく、危険の程度に応じた安全措置が必要です。","化学物質管理・SDS・ラベル":"化学物質管理では、まず対象物質がラベル表示・SDS通知・リスクアセスメントの対象かを確認し、その上で事業場の管理体制、ばく露低減措置、保護具、教育を確認します。物質名だけでなく、混合物・含有率・作業方法まで見て判断するのが基本です。","有機溶剤・塗装":"有機溶剤業務では、対象物質・含有率・作業場所・作業内容から有機則の適用を確認し、換気、作業主任者、呼吸用保護具、特殊健康診断まで一連で確認します。","特定化学物質":"特定化学物質では、対象物質と作業内容を確認した上で、発散抑制設備、局所排気、作業主任者、保護具、休憩室、健康診断等を確認します。物質ごとに規制内容が異なるため、名称だけで一律判断しません。","石綿・解体改修":"石綿関係は、解体・改修前の事前調査から始まり、一定規模以上では結果報告、石綿ありの場合は作業計画・飛散防止・呼吸用保護具・記録保存まで確認します。","停電・活線・感電防止":"電気作業では、停電できる作業は開路・施錠・表示・検電・接地等を確認し、活線又は近接作業では絶縁用保護具・防具、作業指揮者、定期自主検査まで確認します。","ボイラー":"ボイラーでは、製造・設計・設置段階の法定手続と、使用中の作業主任者、圧力・水位・燃焼状態、安全弁、水面測定装置、吹出し、定期自主検査を分けて確認します。","第一種・第二種圧力容器":"圧力容器は、まず第一種か第二種かを判定した上で、使用・点検・安全弁・圧力計・自主検査の適用条文を確認します。区分を誤ると点検周期や手続を誤るため、設備仕様確認が最初です。","産業廃棄物・マニフェスト":"産業廃棄物では、廃棄物の種類、委託先の許可、契約、マニフェスト交付、返送確認、未返送時の措置、保存、年度報告までを一連で管理します。","労働者死傷病報告":"労働災害が発生した場合は、死亡・休業日数を確認して報告期限と方法を判断します。休業4日以上と4日未満で扱いが異なり、現在は原則電子申請です。","安全衛生管理体制":"安全衛生管理体制は、事業場の業種と常時使用労働者数から、総括安全衛生管理者、安全管理者、衛生管理者、安全衛生推進者、産業医、各委員会の要否を判定します。","免許・技能講習・特別教育":"資格関係は、機械や作業の名称だけでなく、最大荷重・機体重量・つり上げ荷重等の境界値で、免許・技能講習・特別教育のどれが必要かを判断します。","機械等・建設工事の届出":"安衛法88条の計画届は、設備名だけでなく、設備区分・能力・規模・扱う物質等から対象性を確認します。対象なら工事開始前の期限と提出図書まで確認します。","危険物施設の工事":"危険物施設では、設備そのものを設置・変更するのか、危険物の品名・数量だけを変更するのかで、許可・完成検査・届出の流れが変わります。","高圧ガス設備・配管":"高圧ガス設備では、設備区分、ガス種、常用圧力、特定設備該当性等を確認した上で、材料・強度・耐圧・気密の基準を判断します。試験倍率だけで一律判断しないことが重要です。","リスクアセスメント・KY":"リスクアセスメントは、設備・原材料・作業方法等の新規採用や変更時などに危険性・有害性を洗い出し、リスク低減措置につなげる制度です。KYは現場の危険予知活動であり、法令上のリスクアセスメントと区別して扱います。","脚立・はしご":"脚立・はしごでは、まず作業高さ、設置面、転位・転倒のおそれ、両手作業の有無を確認します。脚立か移動はしごかで見るポイントが異なるため、角度・幅・転位防止・昇降方法まで確認します。","足場の組立て・解体":"足場の組立て・解体では、作業主任者の要否、作業順序、立入禁止、材料の上げ下ろし、墜落防止、悪天候時の中止、組立て後等の点検まで一連で確認します。","車両系建設機械":"車両系建設機械では、機械の種類・能力と作業場所の地形・地盤から作業計画を作り、運行経路、制限速度、転倒・接触防止、運転位置を離れる際の措置まで確認します。","車両系建設機械の積卸し・移送":"建設機械の積卸しでは、積卸し場所の地盤、道板・盛土等の強度・幅・勾配、車両の逸走・転倒防止、誘導方法を確認します。","フォークリフト・構内運搬":"フォークリフトでは、最大荷重から資格区分を確認し、作業計画、運行経路、接触防止、始業前・月次・年次点検、特定自主検査まで確認します。","重量物・人力運搬":"人力運搬では、重量だけでなく、姿勢、持上げ高さ、運搬距離、頻度、足場条件を確認します。重量物は可能な限り機械化し、必要に応じて複数人作業に切り替えることが基本です。","クレーン検査・点検":"クレーンの点検は、作業開始前、月例、年次など周期ごとに対象項目が異なります。機種・使用状況に応じて、ワイヤロープ、フック、安全装置、ブレーキ、過負荷防止装置等を確認します。","有機溶剤の代表物質":"有機溶剤の代表物質では、物質名だけでなく混合物中の含有率と作業内容を確認します。キシレン、トルエン、DMF、ノルマルヘキサン等では特殊健康診断の検査項目も異なるため、SDSと規則の両方で確認します。","粉じん・研磨・切断":"粉じん作業では、作業が特定粉じん作業等に該当するかを確認し、局所排気・湿潤化、作業環境測定、呼吸用保護具、請負人への周知まで確認します。","鉛・鉛作業":"鉛作業では、対象となる鉛業務かを確認し、作業主任者、換気設備、保護具、設備点検、定期自主検査、特殊健康診断を確認します。","タンク・槽内作業":"タンク・槽内は『閉所だから一律同じ』ではありません。酸欠危険、有機溶剤、特化物、火気等の該当性を分けて確認し、それぞれ必要な測定・換気・保護具・作業主任者を判断します。","溶接・溶断・火気作業":"火気作業では、可燃物・危険物・残留ガスの有無、換気状況、周辺への火花飛散、消火設備、作業後の残火確認を確認します。客先の火気許可票や火気監視人は、法令とは別に現場ルールとして確認します。","作業主任者":"作業主任者は、作業名だけでなく、規模・場所・扱う物質等の条件で選任要否が決まります。対象なら資格要件、氏名・職務の周知、複数選任時の職務分担まで確認します。","職長・安全衛生責任者教育":"職長教育では、対象業種・立場を確認し、作業方法の決定、労働者配置、指導・監督、異常時対応、リスクアセスメント等の教育内容を確認します。安全衛生責任者は混在作業現場での連絡調整役として区別します。","特定元方事業者の安全管理体制":"建設業・造船業の特定元方事業者では、人数にかかわらず安衛法第30条の協議組織、作業間調整、巡視、教育支援等を確認します。統括安全衛生責任者の選任は原則50人以上、ずい道等の特定工事は30人以上が境界です。2026年4月から人数・措置対象には個人事業者等を含む作業従事者も入ります。","作業環境測定":"作業環境測定では、対象作業場かどうか、測定対象物質、測定頻度、測定方法、評価区分、改善措置を確認します。測定だけで終わらず、結果に応じて設備・作業方法を改善する流れが重要です。","健康診断・特殊健康診断":"健康診断では、一般健診か特殊健診か、対象業務、実施時期、頻度、事後措置を確認します。配置替え時や6月ごとなど、業務ごとに周期が異なるため一律に判断しません。","熱中症対策":"熱中症対策では、WBGTや気温だけでなく、作業時間、連続作業、服装、身体負荷を確認します。対象作業では、報告体制、作業離脱、身体冷却、必要に応じた医療機関搬送の手順を事前に決めます。","騒音を伴う特定建設作業":"特定建設作業の騒音では、まず作業機械が政令の対象か、場所が指定地域かを確認します。対象なら7日前届出、敷地境界85dB、時間帯、1日作業時間、連続日数、休日規制を確認します。","振動を伴う特定建設作業":"特定建設作業の振動では、作業機械・作業方法と指定地域を確認し、対象なら7日前届出、敷地境界75dB、時間帯、1日作業時間、連続日数、休日規制を確認します。","騒音・振動作業":"騒音・振動作業では、作業環境測定や個人ばく露を確認し、設備改善、作業時間短縮、保護具、健康診断を組み合わせて管理します。85dBやA(8)の値は、単独で安全・危険を決める数字ではなく対策判断の目安です。","掘削・地山・土止め":"掘削作業では、事前に地山の形状・地質・埋設物・湧水等を調査し、掘削面の高さ・勾配、土止め、立入禁止、作業主任者、悪天候後の点検を確認します。","型枠支保工":"型枠支保工では、組立図、支柱・水平つなぎ・根がらみ等の構造、荷重条件、組立解体手順、コンクリート打設前点検、作業主任者を確認します。","グラインダー・研削といし":"研削といしでは、といしの種類・最高使用周速度・機械との適合、覆い、毎日の作業開始前と取替え後の試運転を確認します。特別教育は「といしの取替え又は取替え時の試運転」の業務が対象で、通常の研削作業そのものと区別して判定します。","プレス・シャー・回転機械":"プレス・シャー等では、危険点への身体進入防止、安全装置、両手操作式等の防護、金型交換・調整時の停止措置、一定規模以上での作業主任者を確認します。","保護具":"保護具は、危険有害要因を特定したうえで適切な種類を選び、必要数を確保し、点検・清潔保持・交換を行います。保護具だけに頼らず、設備・作業方法によるリスク低減を優先します。","建設業法上の技術者配置":"技術者配置では、工事種類、請負金額、下請代金総額から主任技術者・監理技術者・専任要否を判断します。2025年2月改正後の金額基準で確認します。","客先・プラント独自ルール":"客先・プラント独自ルールは法令ではありません。入構教育、火気許可、ロックアウト、作業許可、立入制限、保護具等は客先最新版の安全規程・工事要領・作業許可基準で確認し、法令要求とは分けて表示します。","自家用電気工作物":"自家用電気工作物では、設備が自家用電気工作物に該当するかを確認し、保安規程、主任技術者の選任又は外部委託承認、使用開始前の手続、保安監督体制を確認します。"};

const CURRENT_RULES={"粉じん・研磨・切断":{"checked":"2026-10-04","items":["粉じん則は、まず別表1の粉じん作業、別表2の特定粉じん発生源、常時特定粉じん作業を行う屋内作業場かを順に判定。","常時特定粉じん作業を行う屋内作業場は粉じん濃度を6月以内ごとに1回測定し、測定・評価記録は7年間保存。土石・岩石・鉱物では所定の場合に遊離けい酸含有率も測定。","第三管理区分は直ちに改善措置を講じ、改善困難な場合等は作業環境管理専門家の意見、個人サンプリング測定等、結果に応じた呼吸用保護具等を実施。","2026年10月1日から、法令で行う個人ばく露測定等は所定の作業環境測定士等によるデザイン・サンプリング・分析の要件を確認。","使用前直径300mm未満の研削といしによる所定の特定粉じん作業は第8条の設備措置特例があるが、有効な呼吸用保護具と屋内の全体換気等が必要。","常時特定粉じん作業の粉じん作業特別教育と、研削といし取替え等の特別教育は別制度。"]},"停電・活線・感電防止":{"checked":"2026-10-04","items":["停電作業は安衛則339条により、開路後の施錠・通電禁止表示又は監視人、残留電荷のおそれがある場合の放電、高圧・特別高圧では検電と短絡接地を確認。","復電時は作業者に感電危険がないことと短絡接地器具を取り外したことを確認してから通電。","第350条の停電、高圧・特別高圧活線/近接作業では作業指揮者を定め、作業方法・順序を周知し直接指揮。","高圧活線近接では頭上30cm以内、躯側・足下60cm以内への接近で感電危険がある場合、第342条の絶縁用防具等を確認。","第351条対象の絶縁用保護具等は6月以内ごとに絶縁性能を自主検査し記録3年。第352条対象器具等はその日の使用開始前に点検。","電気機械器具の囲い・絶縁覆いは毎月1回以上点検。対地電圧50V以下は安衛則の電気危険防止章の適用除外だが、他法令・設備基準等は別途確認。"]},"保護具":{"checked":"2026-10-04","items":["安衛則第593～597条の保護具義務と、第12条の6の保護具着用管理責任者制度を分けて判定する。","第12条の6は、化学物質管理者を選任した事業者がRA結果に基づく措置として労働者に保護具を使用させる場合に適用。選任は事由発生から14日以内、事業場ごとに行い、権限付与と氏名周知が必要。","第593・594・594条の2・595条の対象保護具は同時就業人数と同数以上を備え、常時有効かつ清潔に保持する。","第三管理区分等で呼吸用保護具を使用させる場合は、有機則・特化則・鉛則・粉じん則等の特別則による保護具着用管理責任者の要件も確認する。"]},"化学物質管理・SDS・ラベル":{"checked":"2026-10-04","items":["2024年4月1日から、リスクアセスメント対象物を製造・取り扱い・譲渡提供する事業場ごとに化学物質管理者を選任。業種・事業場規模による人数要件なし。","化学物質管理者は選任事由発生から14日以内。製造事業場は所定講習修了者等から選任し、製造以外では法定資格要件はないが必要な能力を有する者を選任。権限付与と氏名周知も必要。","2026年4月1日現在、ラベル・SDS交付義務対象物質は2,316物質で、これらはリスクアセスメント対象物に該当。対象物質は今後も改正されるため最新一覧で確認。","RAは新規採用・変更、作業方法等の新規採用・変更、危険有害性の変化等の法定時期に実施。","化学物質管理者選任事業場でRA結果に基づき保護具を使用させる場合は、安衛則第12条の6の保護具着用管理責任者も別途確認。"]},"石綿・解体改修":{"checked":"2026-10-03","items":["建築物の解体は解体部分の床面積合計80㎡以上で事前調査結果報告の対象。","建築物の改修は請負金額100万円以上、厚労大臣が定める工作物の解体・改修も請負金額100万円以上で報告対象。","事前調査結果の記録は3年間保存。","2026年1月1日以降着工の対象工作物では、資格者による事前調査が必要。"]},"熱中症対策":{"checked":"2026-10-03","items":["2025年6月1日施行の安衛則改正で、熱中症の重篤化防止措置が義務化。","法令上の対象はWBGT28℃以上又は気温31℃以上の環境で、継続1時間以上又は1日4時間を超えて行われることが見込まれる作業。","報告体制をあらかじめ整備し、対応手順を作成して関係作業者へ周知。"]},"建設業法上の技術者配置":{"checked":"2026-10-04","items":["建設業許可業者は、元請・下請や請負金額の大小にかかわらず、原則として請け負った建設工事の現場に主任技術者を配置。","元請が施工のため締結する下請契約額の合計が5,000万円以上（建築工事業8,000万円以上）なら、特定建設業許可・監理技術者配置等を確認。金額は税込。","公共性のある重要な建設工事で請負代金4,500万円以上（建築一式9,000万円以上）なら、主任技術者又は監理技術者の専任が原則。","2025年2月1日から現行金額基準。専任特例・兼任制度があるため、金額だけで最終判定しない。"]},"労働者死傷病報告":{"checked":"2026-10-04","items":["死亡又は休業見込4日以上は、労働者死傷病報告を遅滞なく提出。","休業1～3日は四半期ごとにまとめ、1～3月分は4月末、4～6月分は7月末、7～9月分は10月末、10～12月分は翌年1月末までに報告。","不休災害は労働者死傷病報告の対象外。","2025年1月1日から原則電子申請。電子申請が困難な場合は当分の間、書面報告も可能。"]},"機械等・建設工事の届出":{"checked":"2026-10-04","items":["対象機械等の設置・移転・主要構造部分変更は、安衛法第88条第1項により工事開始30日前まで。対象性は安衛則第85条・別表第7等で判定。","特に大規模な建設工事は第88条第2項により仕事開始30日前までに厚生労働大臣へ届出。","一定規模以上の建設工事等は第88条第3項により仕事開始14日前までに所轄労働基準監督署長へ届出。","足場は高さ10m以上（つり・張出し足場を除く）等、型枠支保工は支柱高さ3.5m以上等、個別の規模条件・除外条件を別表第7等で確認。"]},"産業廃棄物・マニフェスト":{"checked":"2026-10-03","items":["通常の産業廃棄物では、運搬・処分終了票が交付から90日以内に返送されない場合、処理状況を確認。","特別管理産業廃棄物では60日以内、最終処分終了確認は180日以内。","期限超過後に講じた措置等は30日以内に都道府県知事等へ報告。","紙マニフェスト等の保存期間は5年間。"]},"騒音を伴う特定建設作業":{"checked":"2026-10-03","items":["指定地域内の特定建設作業は、原則として作業開始日の7日前までに届出。","敷地境界の基準は85dB以下。","第1号区域は原則19時～翌7時、第2号区域は原則22時～翌6時の作業を行わない。","1日作業時間は第1号区域10時間以内、第2号区域14時間以内、連続6日以内。"]},"振動を伴う特定建設作業":{"checked":"2026-10-03","items":["指定地域内の特定建設作業は、原則として作業開始日の7日前までに届出。","敷地境界の基準は75dB以下。","第1号区域は原則19時～翌7時、第2号区域は原則22時～翌6時の作業を行わない。","1日作業時間は第1号区域10時間以内、第2号区域14時間以内、連続6日以内。"]},"第一種・第二種圧力容器":{"checked":"2026-10-03","items":["第一種圧力容器は1月以内ごとに1回の定期自主検査。","第二種圧力容器は1年以内ごとに1回の定期自主検査、記録は3年間保存。","第二種圧力容器の安全弁は原則として最高使用圧力以下で作動するよう調整。"]},"ボイラー":{"checked":"2026-10-03","items":["水面測定装置の機能は1日に1回以上点検。","定期自主検査は1月以内ごとに1回。","2026年改正でボイラー設計審査制度が追加。"]},"プレス・シャー・回転機械":{"checked":"2026-10-03","items":["動力プレスを5台以上有する事業場で行う対象作業では、プレス機械作業主任者の選任が必要。","金型の取付け・取外し・調整で危険限界に身体が入る場合は、安全ブロック等で不意な下降を防止。","プレス等は、その日の作業開始前に法定事項を点検。"]},"作業環境測定":{"checked":"2026-10-04","items":["2026年10月1日、改正安衛法第65条の3等が施行され、個人ばく露測定が作業環境測定の一部として位置付けられた。","一定の個人ばく露測定では、追加講習等の要件を満たす作業環境測定士等による実施が必要。","リスクアセスメントで個人ばく露測定を行う場合も、2026年10月1日以降は法令上の実施者・分析者要件を確認する。","測定義務・周期・記録保存期間は対象物質・作業場・管理区分ごとに異なるため、一律に扱わない。"]},"免許・技能講習・特別教育":{"checked":"2026-10-03","items":["フォークリフト：最大荷重1トン以上は技能講習、1トン未満は特別教育。","車両系建設機械（整地・運搬・積込み・掘削用等）：機体重量3トン以上は技能講習、3トン未満は特別教育。","移動式クレーン：つり上げ荷重5トン以上は免許、1トン以上5トン未満は技能講習、1トン未満は特別教育。","玉掛け：つり上げ荷重等1トン以上は技能講習、1トン未満は特別教育。"]},"健康診断・特殊健康診断":{"checked":"2026-10-03","items":["一般定期健康診断は1年以内ごとに1回、特定業務従事者は配置替え時及び6月以内ごとに1回。","一般健康診断個人票は5年間保存、医師等の意見聴取は原則3月以内。","有機溶剤健康診断個人票は5年間保存、医師意見は3月以内。","特定化学物質健康診断個人票は原則5年間、特別管理物質に係る一定の個人票は30年間保存。"]},"安全衛生管理体制":{"checked":"2026-10-03","items":["総括安全衛生管理者は業種により100人以上・300人以上・1,000人以上で選任。","安全管理者は対象業種で50人以上、衛生管理者と産業医は原則として全業種50人以上。","安全衛生推進者又は衛生推進者は10人以上50人未満。選任すべき事由発生日から14日以内に選任し、氏名を関係労働者へ周知。","産業医は1,000人以上又は法定有害業務に500人以上で専属、3,000人超では2人以上。","衛生管理者は50～200人で1人以上、200人超～500人で2人以上、500人超～1,000人で3人以上、1,000人超～2,000人で4人以上、2,000人超～3,000人で5人以上、3,000人超で6人以上。"]},"特定元方事業者の安全管理体制":{"checked":"2026-10-04","items":["特定事業は建設業・造船業。特定元方事業者の安衛法第30条の混在作業防止措置は、統括安全衛生責任者の選任人数未満でも必要。","統括安全衛生責任者は原則として同一場所の作業従事者が常時50人以上。ずい道等、一定の橋梁建設、圧気工法は常時30人以上。","2026年4月1日から、混在作業場所における人数・措置対象が労働者だけでなく個人事業者等を含む作業従事者へ拡大。","統括安全衛生責任者を選任する建設現場では元方安全衛生管理者を選任。関係請負人側は安全衛生責任者を選任して連絡等を行う。","特定元方事業者の作業場所巡視は毎作業日に少なくとも1回。教育への指導援助、建設業の工程・設備配置計画、所定の場合の作業開始後の報告も確認。"]},"職長・安全衛生責任者教育":{"checked":"2026-10-04","items":["安衛法第60条の職長等教育は、安衛令第19条の対象業種で新たに職長等の職務に就く者に実施。法定時間は合計12時間以上。","2023年4月1日から食料品製造業、新聞業、出版業、製本業、印刷物加工業が対象に追加され、現行の製造業除外範囲が縮小。","安全衛生責任者は法第16条に基づく別の選任制度。建設業の統合教育は職長教育12時間＋安全衛生責任者関係2時間の14時間。","建設業の再教育は概ね5年ごと又は機械設備等に大幅な変更があったときに受けさせることが望ましいとされる。"]},"作業主任者":{"checked":"2026-10-04","items":["作業主任者は安衛法第14条・安衛令第6条の一定の作業について選任。作業名だけでなく各号の規模・高さ・場所・物質等の条件で要否を判定。","資格は一律ではない。高圧室内・ガス溶接・X線等は免許、地山掘削・型枠・足場・有機溶剤・酸欠等は技能講習など、作業区分ごとに確認。","資格保有者が現場にいるだけでは選任完了ではない。事業者が作業主任者として選任し、個別規則の職務を行わせる。","氏名とその者に行わせる事項は、安衛則第18条により作業場の見やすい箇所への掲示等で関係労働者へ周知。","同一場所で同一作業の作業主任者を2人以上選任した場合は、安衛則第17条により職務分担を定める。","地山掘削2m、足場5m等の数値はそれぞれの作業区分の境界であり、土止め支保工や型枠支保工へ流用しない。"]}};

const CHANGELOG=[{"version":"v179","date":"2026-10-04","type":"粉じん作業・特定粉じん・測定・研削特例を分離","text":"粉じん障害防止規則2・8・17・18・22・24～27条と2026年10月1日施行の個人ばく露測定制度を再確認。粉じん作業/特定粉じん作業/測定対象を段階判定し、6月測定、7年記録、第三管理区分措置、面体保護具の年1回装着確認、300mm未満研削といしの設備特例、粉じん特別教育と研削といし特別教育の違いを整理。"},{"version":"v178","date":"2026-10-04","type":"停電・活線作業の339～354条を現場手順として再構成","text":"安衛則339・341・342・346・349～354条を厚労省現行条文で再確認。停電時の施錠/表示/監視、残留電荷放電、高圧・特高の検電＋短絡接地、復電前確認、作業指揮者を一連化。高圧近接30cm/60cm、絶縁用保護具等6月検査・3年記録、使用開始前点検、囲い等毎月点検、対地50V以下の本章適用除外も整理。"},{"version":"v177","date":"2026-10-04","type":"化学物質管理者・ラベルSDS・RA対象を2026年現行化","text":"安衛則12条の5、安衛法57～57条の3、厚労省の化学物質管理Q&A・2026年対象物質資料を再確認。化学物質管理者はRA対象物を製造・取扱い・譲渡提供する事業場ごと、人数要件なし、14日以内に選任。製造事業場は所定講習修了者等、製造以外は法定資格要件なしと分離。2026年4月時点2,316物質、RA法定実施時期、SDS人体作用の定期確認・更新、保護具着用管理責任者との関係を整理。"},{"version":"v176","date":"2026-10-04","type":"作業主任者の資格・選任・周知を分離し、周知条文を18条へ訂正","text":"厚労省「職場のあんぜんサイト」作業主任者一覧と安衛法14条・安衛令6条・安衛則17～18条を再確認。作業主任者には免許型と技能講習型があること、資格保有と正式選任は別であること、地山2m・足場5m等の境界を他作業へ流用しないことを明示。既存の『氏名・職務の周知＝安衛則16条』を『氏名・行わせる事項の周知＝18条』へ訂正し、複数選任時の職務分担＝17条と整理。"},{"version":"v175","date":"2026-10-04","type":"一般保護具義務と保護具着用管理責任者の選任条件を分離","text":"安衛則第12条の6、第593～597条と厚労省通達を再確認。一般的な保護具義務と2024年4月施行の保護具着用管理責任者制度を分離。化学物質管理者選任＋RA結果で保護具使用の場合の14日以内選任、事業場ごとの選任、権限付与・氏名周知、知識経験要件、同時就業人数と同数以上の保護具、第三管理区分等の特別則ルートを整理。"},{"version":"v174","date":"2026-10-04","type":"特定元方の30/50人境界と2026年4月作業従事者拡大を反映","text":"安衛法第15・15条の2・16・29・30条、安衛令第7条、安衛則第637・638・638条の2・664条と2026年改正資料を再確認。特定事業=建設業・造船業、統括安全衛生責任者は原則50人・ずい道等30人、毎作業日1回以上巡視を整理。30/50人未満でも第30条措置義務があること、2026年4月1日から個人事業者等を含む作業従事者へ人数・措置対象が拡大されたことを反映。"},{"version":"v173","date":"2026-10-04","type":"職長教育12時間・対象業種・安全衛生責任者14時間を分離","text":"安衛法第16・60条、安衛令第19条、安衛則第40条と厚労省の建設業再教育資料を再確認。職長等教育は対象業種の新任職長等に12時間以上、2023年4月から食料品製造業等の対象拡大を反映。安全衛生責任者は別の選任制度であり、建設業の職長・安全衛生責任者統合教育14時間、概ね5年ごとの再教育推奨を区別。"},{"version":"v172","date":"2026-10-04","type":"建設業法の5,000万と4,500万の判定軸を分離","text":"国土交通省の2025年2月改正資料・2026年技術者制度資料を再確認。許可業者は原則として請負金額にかかわらず主任技術者を配置。元請の下請代金合計5,000万円（建築工事業8,000万円）は監理技術者等、公共性ある重要工事の請負4,500万円（建築一式9,000万円）は専任の境界として分離。税込判定と専任特例・兼任制度も明示。"},{"version":"v171","date":"2026-10-04","type":"作業環境測定の2026年10月1日改正を現行化・4月施行誤記を修正","text":"厚労省の改正法・施行資料を再確認し、安衛法第65条の3による個人ばく露測定の作業環境測定への位置付けを2026年10月1日施行へ訂正。一定の個人ばく露測定における作業環境測定士等の実施者要件、RAで測定する場合の要件、第三管理区分の6月測定、3年・7年・30年など対象別保存期間を整理。"},{"version":"v170","date":"2026-10-04","type":"一般・特定業務・有機溶剤・特化物健診の周期と保存期間を分離","text":"安衛則第43～45・51・51条の2、有機則第29・30・30条の2、特化則第39・40・40条の2を再確認。一般定期1年、特定業務6月（胸部X線1年で可）、有機溶剤6月、特化物は物質・業務別周期と整理。記録は一般・有機溶剤5年、特化物原則5年・特別管理物質30年、医師意見聴取3月以内を同期。"},{"version":"v169","date":"2026-10-04","type":"安全衛生管理体制の10・50・100・300・1000人境界を業種別に分離","text":"安衛法第10～13・17～18条、安衛令第2～5・8～9条、安衛則第12条の2～4・第13条等を再確認。10～49人の推進者、50人以上の衛生管理者・産業医・衛生委員会、指定業種の安全管理者、業種別100/300/1000人の総括安全衛生管理者、安全委員会の50/100人境界を分離。事業場単位で判定すること、50人未満でも意見聴取機会が必要なこと、産業医の専属・複数選任条件も追加。"},{"version":"v168","date":"2026-10-04","type":"騒音85/90dB・振動A(8)2.5/5.0の法的位置付けを分離","text":"厚労省の2023年改訂騒音障害防止ガイドラインと振動障害予防対策指針を再確認。85/90dBをガイドライン上の管理・対策区分、A(8)2.5/5.0m/s²を振動指針の対策値・限界値として表示し、一律の罰則付き法定上限と誤読しない構成へ修正。騒音測定10分以上、記録3年、定期健診6月以内ごと、振動A(8)算定式も整理。"},{"version":"v167","date":"2026-10-04","type":"動力プレス5台境界・特別教育・2026特定自主検査基準を分離","text":"安衛令第6条第7号、安衛則第36条第2号・第131～136条、2026年施行の特定自主検査制度改正を再確認。動力プレス5台以上は作業主任者選任の境界であり、5台未満でも安全措置・始業前点検・定期自主検査・金型等調整の特別教育が別途適用されることを明示。動力プレス・シャーの年次検査、3年保存、2026年1月1日からの特定自主検査基準も反映。"},{"version":"v166","date":"2026-10-04","type":"研削といしの1分・3分試運転と特別教育範囲を分離","text":"安衛則第36・38・117～119条、安全衛生特別教育規程第1・2条を再確認。作業開始前1分以上、取替え時3分以上の試運転を明確化。特別教育の対象は研削といしの取替え又は取替え時の試運転であり、通常の研削作業そのものを一律に対象としないことを明示。機械研削7+3時間、自由研削4+2時間、教育記録3年、最高使用周速度、覆いの50mm未満例外も整理。"},{"version":"v165","date":"2026-10-04","type":"クレーン年次・月次・始業前・暴風後点検と記録保存を分離","text":"クレーン等安全規則第34～38条、第76～79条を再確認。固定式クレーンの年次自主検査は原則荷重試験を伴い、月次・始業前とは別義務。瞬間風速30m/s超は作業許可風速ではなく屋外クレーンの暴風後点検条件。固定式クレーンの年次・月次・暴風後等は3年保存だが、第36条の始業前点検は第38条の法定3年保存対象外であることを明示。"},{"version":"v164","date":"2026-10-04","type":"安衛法88条の30日前・14日前届出を分離","text":"安衛法第88条、安衛則第85・89・90条、別表第7を再確認。対象機械等の設置等は30日前、特に大規模な建設工事は30日前、一定規模以上の建設工事等は14日前と分離。足場高さ10m以上、型枠支保工支柱3.5m以上、高さ31m超建築物等、10m以上の地山掘削等の代表条件と除外確認を追加。"},{"version":"v163","date":"2026-10-04","type":"労働者死傷病報告の4日境界・四半期期限・電子申請を精密化","text":"安衛則第97条と2025年1月1日施行改正を再確認。死亡又は休業見込4日以上は遅滞なく、休業1～3日は四半期ごとの翌月末日、不休災害は死傷病報告対象外と分離。2025年1月1日から原則電子申請、困難時は当分の間書面可を明記し、『休業4日未満は全部四半期報告』という誤読を修正。"},{"version":"v162","date":"2026-10-04","type":"熱中症612条の2の対象条件・義務を精密化","text":"安衛則第612条の2と令和7年5月20日施行通達を再確認。WBGT28℃以上又は気温31℃以上に加え、連続1時間以上又は1日4時間を超える見込みという時間条件を法令対象条件として明示。報告体制、離脱・身体冷却・必要時の医師診察等の手順、周知を水分補給等の一般対策と分離し、2025年6月1日施行済みと整理。"},{"version":"v161","date":"2026-10-04","type":"石綿の事前調査・報告規模・2026工作物資格要件を分離","text":"厚生労働省の石綿総合情報ポータルと石綿則を再確認。80㎡・税込100万円は事前調査そのものの実施基準ではなく結果報告の規模基準であることを明確化。重量0.1％超、3年保存、鋼製船舶20t以上を追加し、2026年1月1日の一定工作物の事前調査者資格要件を『施行予定』ではなく『施行済み』へ更新。"},{"version":"v160","date":"2026-10-04","type":"特化則の月次点検・年次自主検査・記録期間を分離","text":"特化則第27・28・30・39・40・40条の2等を再確認。作業主任者による局排等の点検（1月を超えない期間ごと）と、対象装置の定期自主検査（1年以内ごとに1回）を別義務として表示。特殊健診の周期や5年/30年の記録保存は物質・業務別であるため一律表示を避けた。"},{"version":"v159","date":"2026-10-04","type":"有機溶剤5％・健診・作業主任者の適用境界監査","text":"有機則第1・2・19・19条の2・29・30・30条の2を再確認。重量5％超は有機溶剤含有物の定義に用いる基準であり、安全/危険の境界ではないことを明示。作業主任者、健診対象、6月周期、5年保存、3月以内の医師意見、局排等の月次点検を適用条件付きで整理。"},{"version":"v158","date":"2026-10-04","type":"酸欠第一種・第二種の境界監査","text":"酸欠則第2・3・5・11条を再確認。酸素18%未満、硫化水素10ppm超の定義と、第一種・第二種の測定・換気・作業主任者資格を分離。第二種は第二種技能講習修了者から作業主任者を選任すること、第一種/第二種は測定値だけで決める区分ではないことを明記。"},{"version":"v157","date":"2026-10-04","type":"掘削・土止め・型枠の作業主任者境界監査","text":"地山掘削は掘削面高さ2m以上、土止め支保工は切りばり又は腹おこしの取付け・取外し、型枠支保工は組立て又は解体の作業が作業主任者選任対象であることを分離。2m基準を土止め・型枠へ誤適用しないよう表示・検索データを同期。"},{"version":"v156","date":"2026-10-04","type":"足場2m・5m・特別教育の境界分離","text":"安衛令第6条第15号、安衛則第36・564・565条を再確認。高さ2m以上の組立て等安全措置と、つり足場・張出し足場又は高さ5m以上の作業主任者選任を分離。足場組立て等従事者の特別教育は地上又は堅固な床上の補助作業を除き高さ5m未満でも対象になり得ることを明記。"},{"version":"v155","date":"2026-10-04","type":"高所2m基準・判定ロジック整合化","text":"安衛則第518・519・521条に合わせ、高さ2m以上を単純な墜落制止用器具着用ラインとして表示しないよう整理。作業床、端部・開口部防護、設置困難時の防網・墜落制止用器具、取付設備の順に表示。併せて残っていたクレーン判定の旧1t/5tロジックも通常クレーンと移動式に分離。"},{"version":"v154","date":"2026-10-04","type":"基準値の内部整合性監査","text":"v150～v153で修正した資格・足場・玉掛け基準を、検索用factsとFAQにも同期。特に『クレーン5t未満』FAQが移動式クレーンの1t/5t区分を全クレーンに誤適用していたため修正。表示箇所による回答矛盾を解消。"},{"version":"v153","date":"2026-10-04","type":"足場・脚立・はしご基準の監査","text":"安衛則第527・528・563条を再確認。足場の床材と建地の隙間12cm未満、手すり85cm以上、中桟35～50cmを追加。脚立75度以下は第528条の法令値だが、移動はしごの75度等は第527条の直接の法令値ではないことを明示。"},{"version":"v152","date":"2026-10-04","type":"フォークリフト・車両系建設機械の資格境界監査","text":"厚生労働省・労働局の資格資料を再確認。フォークリフトは最大荷重1t、整地等・基礎工事用・解体用の車両系建設機械は機体重量3tが境界であることを明確化。道路上の走行を除く業務区分であること、締固め用等は別区分があることも追記。"},{"version":"v151","date":"2026-10-04","type":"玉掛け資格・吊具基準の精密化","text":"厚生労働省のクレーン等安全規則第213条～第222条を再確認。玉掛け資格の1t境界を『実荷重』ではなくクレーン等の『つり上げ荷重』と明示し、ワイヤロープ・つりチェーン・フック/シャックルの安全係数と使用禁止基準を整理。"},{"version":"v150","date":"2026-10-04","type":"クレーン資格境界の修正","text":"厚生労働省のクレーン等安全規則・資格一覧に基づき、クレーンと移動式クレーンの資格境界を分離。クレーン5t未満は特別教育、5t以上は原則免許（床上操作式等は方式による区分あり）、移動式は5t以上免許・1t以上5t未満技能講習・1t未満特別教育として表示。"},{"version":"v149","date":"2026-10-04","type":"公式資料の重複整理","text":"詳細画面の主公式資料と関連公式資料で同じURLが重複表示されるケースを除外。関連資料がある場合だけ『関連する公式資料』として分離し、同じ情報を一度だけ表示する構成へ修正。"},{"version":"v148","date":"2026-10-04","type":"公式資料の種類表示","text":"公式資料リンクに『法令本文』『厚生労働省』『環境省』『経済産業省』『国土交通省』『消防庁』等の種別・発行元を表示。何を開くリンクか分かるようにし、e-Gov法令本文と行政資料を区別。"},{"version":"v147","date":"2026-10-04","type":"公式資料表示の精度向上","text":"公式URLがない場合の『確認中』を『公式資料リンク未登録』へ変更。告示・通達・指針等も含むリンク群を一律『公式一次資料』と呼ばず、『公式資料』へ統一して資料種別の誤認を防止。"},{"version":"v146","date":"2026-10-04","type":"確認日の意味を明確化","text":"改正・施行情報の『最終確認』を『掲載情報確認日』へ変更。これはナビ掲載情報の確認日であり、法令の施行日・最終改正日そのものではないことを明示。"},{"version":"v145","date":"2026-10-04","type":"条文表示の誤認防止","text":"検索結果カードの条文説明は法令原文ではなく要約・要旨であるため、本文の先頭に小さく『要旨』を明示。法令名・条文番号はそのまま維持し、原文確認は詳細画面の公式資料へ誘導。"},{"version":"v144","date":"2026-10-04","type":"検索ボタン寸法修正","text":"旧スマホCSSの2列指定が残っていたため、検索行を入力欄＋×＋検索の3列に固定。×クリアと検索ボタンを同じ幅・同じ高さへ完全統一し、スマホで改行しないよう修正。"},{"version":"v143","date":"2026-10-04","type":"詳細画面の不要操作削除","text":"送付先未設定の『誤り・改正を報告』を詳細画面から撤去。機能しない操作を現場画面に出さず、共有だけを最下部の補助操作として残した。"},{"version":"v142","date":"2026-10-04","type":"詳細画面の戻る操作","text":"詳細画面右上の×を『← 戻る』へ変更。検索結果へ戻る操作であることを明確化し、PC・スマホとも押しやすいサイズへ調整。"},{"version":"v141","date":"2026-10-04","type":"詳細画面カード削減","text":"詳細画面の資格・教育・書類・連絡先・作業前確認・緊急時などで重なっていた囲みカード表現を削減。内容と順序は変えず、見出し＋本文＋細い区切り線を基本に統一。"},{"version":"v140","date":"2026-10-04","type":"検索操作統一","text":"検索ボタンと×クリアを同じ46px高に統一し、スマホでも検索欄・×・検索が崩れにくいよう調整。検索結果件数は補助情報として小さく表示。"},{"version":"v139","date":"2026-10-04","type":"検索画面整理","text":"検索欄の長い説明・重複例示・全件表示ボタンを削除。『キーワード検索』と入力例だけに簡素化。フッターも機能説明をやめ、条例・客先ルールの適用注意だけに短縮。"},{"version":"v138","date":"2026-10-04","type":"トップ画面簡素化","text":"ダッシュボード的に見える横断監査バー、テーマ数・法令数等の統計、公式確認済み中心/数値期限あり/新人向け等の状態フィルタ、クイックチップ列を公開画面から撤去。検索を主役に整理。"},{"version":"v137","date":"2026-10-04","type":"法令と現場手法の区別","text":"リスクアセスメントとKYを同じ法的義務に見せないよう、『法令上の義務・現場手法』として区別し注記を追加。一次資料見出しは『公式資料で確認』へ変更。"},{"version":"v136","date":"2026-10-04","type":"規制値の区分明確化","text":"『法令上の規制・基準』に行政指針・参考値・客先ルールが混在して見える問題を修正。重量物・騒音振動は『指針・基準』、客先独自ルールは『現場ルール』、高圧ガスは『法令・技術基準』として区別表示。"},{"version":"v135","date":"2026-10-04","type":"検索結果重複削除","text":"検索結果カードでテーマ説明と法令本文要旨が重複していたため、テーマ説明を削除。テーマ名→法令名＋条文番号→本文要旨→詳しく見る、に一本化し、法令部分の箱装飾も廃止。"},{"version":"v134","date":"2026-10-04","type":"検索結果カード簡素化","text":"検索結果カード上部に残っていたカテゴリ・法令区分・確認状態のバッジとe-Gov Law ID表示を撤去。テーマ名→短い説明→法令名＋条文番号＋本文→詳しく見る、だけに整理。"},{"version":"v133","date":"2026-10-04","type":"管理機能UI撤去","text":"ダッシュボード削除後に残っていた更新管理・変更履歴・一次資料リンク監査・実務ガイド網羅性の管理用ボタンを公開画面から撤去。逆引き検索は実用機能として維持。"},{"version":"v132","date":"2026-10-04","type":"ダッシュボード削除","text":"ユーザー画面からダッシュボードを削除。法令検索・テーマ検索・詳細確認に必要な導線へ絞り込み。"},{"version":"v131","date":"2026-10-04","type":"改正情報表示整理","text":"『現行基準・改正情報』を『改正・施行情報』へ変更。大きなカード表示をやめ、最終確認日と改正・施行事項だけを静かな一覧で表示。直近の変更履歴バージョン表記も補正。"},{"version":"v130","date":"2026-10-04","type":"現場判断導線","text":"詳細ページを現場判断順に再整理。『要点解説』を『この作業で守ること』へ変更し、規制・基準の直後に判定、その後に適用条件を配置。"},{"version":"v129","date":"2026-10-04","type":"情報密度整理","text":"トップカードで重複していた法令名単独行を削除し、法令名＋条文番号＋本文へ集約。詳細の関連テーマを削除。共有・報告は最下部の小型補助操作へ縮小。"},{"version":"v128","date":"2026-10-03","type":"規制・基準表示再設計","text":"詳細画面の規制・基準を『規制内容｜法令上の値・義務』の2列だけに簡素化。適用高さ・規定・点検等の小ラベルやカード装飾、各行の条文番号重複を廃止。"},{"version":"v127","date":"2026-10-03","type":"詳細ページ整理","text":"詳細ページ上部のカテゴリ・法令区分・確認状態バッジとe-Gov Law IDを削除し、法令区分を実質的な最上位に固定。検索ワード欄と内部品質表示も削除。"},{"version":"v126","date":"2026-10-03","type":"詳細ページ簡素化","text":"詳細ページの条文セクションを削除。『法令上の規制・基準』は装飾カードを廃止し、『規制対象・条件 → 法令上の値/義務』を1行で読める一覧へ変更。"},{"version":"v125","date":"2026-10-03","type":"トップカード簡素化","text":"『主な根拠法令・条文』という見出しを削除し、『法令名＋条文番号』→短い本文の直接表示へ変更。トップカードの基準値ピルと検索ワード囲み表示も削除。"},{"version":"v124","date":"2026-10-03","type":"トップカード整理","text":"トップカードの機能バッジ（適用判定・30秒判定・役割・共有・書類・FAQ）と検索ワードの丸囲みチップを非表示化。根拠法令・条文と法令上の基準は維持。"},{"version":"v123","date":"2026-10-03","type":"トップカード法令根拠表示","text":"検索結果カードへ『主な根拠法令・条文』をコンパクト表示。1テーマに複数法令がある場合は法令ごとに複数行表示。連続条文は範囲表記へ圧縮。公開カードの確認情報スコア・旧機能バッジを削除。"},{"version":"v122","date":"2026-10-03","type":"視認性・安定化","text":"実際の描画クラス（書類・資格・適用条件・判定・緊急時・条文等）を15〜16pxへ統一。詳細画面の後処理並べ替えを停止し、生成テンプレートを唯一の表示順とした。"},{"version":"v121","date":"2026-10-03","type":"視認性・表記修正","text":"『重要な数値・基準』を『法令上の基準・義務』へ変更。主要本文15.5〜16px、見出し18px、補足13〜14pxへ拡大し、書類カードの余白を圧縮。"},{"version":"v120","date":"2026-10-03","type":"詳細ページ再構築","text":"後処理を廃止し、詳細ページ生成テンプレートを直接修正。法令区分を最上位に固定し、不要・重複項目を生成段階から除外。"},{"version":"v120","date":"2026-10-03","type":"詳細UI再構築","text":"詳細ページを現場判断中心に削って再構築。重複セクション・管理情報・FAQ・関連条文丸囲みを除去し、数値カードの主従を修正。"},{"version":"v117","date":"2026-10-03","type":"詳細UI再設計","text":"詳細ページを実務優先順へ全面再配置。法令区分→要点→数値→適用条件→判断→作業前確認を上位化し、管理・共有系を最下部へ移動。"},{"version":"v116","date":"2026-10-03","type":"UI改善","text":"検索結果ソートを追加し、詳細ページに重要情報サマリーを新設。検索結果上部のHTML構造も整理。"},{"version":"v115","date":"2026-10-03","type":"UI改善","text":"詳細ページの情報強弱・カード階層・クイックナビ・検索結果カードを再設計。"},{"version":"v113","date":"2026-10-03","type":"一括強化","text":"残存の薄い主要テーマへFAQ・必要書類・責任分担を追加し、全49テーマの実務ガイド底上げを最終段階へ。"},{"version":"v112","date":"2026-10-03","type":"一括強化","text":"高所・足場・車両・クレーン・玉掛け・特化物・熱中症・産廃・客先ルール等10テーマを一括強化。"},{"version":"v111","date":"2026-10-03","type":"一括強化","text":"クレーン点検・研削・職長・元方・管理体制・健診・資格・届出・騒音振動の10テーマを一括強化。"},{"version": const QUESTION_GUIDES={"墜落・高所作業":[{"q":"高さ2m未満なら墜落対策は不要？","a":"いいえ。2mは代表的な法令境界ですが、2m未満でも墜落危険があれば安全措置が必要です。"},{"q":"フルハーネスを着ければ作業床はいらない？","a":"いいえ。まず作業床・手すり等による墜落防止を優先し、必要に応じて墜落制止用器具を使用します。"}],"足場の組立て・解体":[{"q":"足場を少しだけ変更する場合も点検が必要？","a":"組立て・一部解体・変更後は点検対象となるため、使用前に状態を確認します。"},{"q":"強風や大雨の後は？","a":"強風・大雨・大雪・中震以上の地震後などは点検要否を確認し、異常があれば是正してから使用します。"}],"フォークリフト・構内運搬":[{"q":"最大荷重1t未満なら無資格でいい？","a":"いいえ。1t未満でも特別教育が必要です。"},{"q":"月次点検だけでいい？","a":"いいえ。作業開始前点検、月次、年次の定期自主検査を区別して確認します。"}],"クレーン・移動式クレーン":[{"q":"5t未満なら免許はいらない？","a":"機械の種類で異なります。通常のクレーンは5t未満が特別教育の対象です。移動式クレーンは1t以上5t未満が小型移動式クレーン運転技能講習、1t未満が特別教育です。5t以上はそれぞれ免許区分を確認します。"},{"q":"アウトリガーを張ればどこでも吊れる？","a":"いいえ。地盤、支持力、作業半径、定格荷重、水平度、周囲障害物を確認します。"}],"玉掛け・吊具":[{"q":"吊荷が1t未満なら特別教育でいい？","a":"原則として実際の荷重量ではなく、使用するクレーン等のつり上げ荷重区分で判定します。"},{"q":"ワイヤロープは見た目がきれいなら使える？","a":"断線、径減少、キンク、変形、腐食等の廃棄基準を確認します。"}],"酸素欠乏・閉所":[{"q":"酸素濃度18%以上なら絶対安全？","a":"いいえ。硫化水素等の有害ガス、換気停止、再流入、作業中の濃度変化も確認します。"},{"q":"人が倒れたらすぐ助けに入る？","a":"無防備で入ってはいけません。酸素欠乏症等にかかった者を救出する場合は、救出者に空気呼吸器等を使用させるなど二次災害防止措置を講じます。"}],"停電・活線・感電防止":[{"q":"ブレーカーを切れば触っていい？","a":"いいえ。施錠・表示、検電、放電、必要に応じ短絡接地まで確認します。"},{"q":"絶縁手袋があれば活線作業していい？","a":"活線・近接作業には個別の要件があります。保護具だけでなく作業方法・監視・距離・資格等を確認します。"}],"石綿・解体改修":[{"q":"80㎡・100万円未満なら事前調査不要？","a":"いいえ。80㎡・100万円は事前調査そのものの実施基準ではなく、事前調査結果を行政へ報告する規模基準です。規模未満でも原則として事前調査は必要です。"},{"q":"0.1％以下なら石綿対応は何も不要？","a":"0.1％は石綿等の規制対象となる含有率基準です。ただし、含有率の判定には適切な事前調査・分析等が必要で、工事前の事前調査義務そのものがなくなるわけではありません。"}],"熱中症対策":[{"q":"WBGT28℃未満なら対策不要？","a":"いいえ。法定対象条件外でも、作業強度・服装・暑熱順化・体調に応じた熱中症対策は必要です。"},{"q":"体調不良者を一人で休ませていい？","a":"異常者を一人にせず、状態を継続確認し、必要に応じて救急要請します。"}],"産業廃棄物・マニフェスト":[{"q":"マニフェストを渡したら排出事業者の責任は終わり？","a":"いいえ。返送確認、最終処分確認、期限超過時の措置・報告まで管理します。"},{"q":"紙マニフェストは何年保存？","a":"5年間です。"}],"労働者死傷病報告":[{"q":"休業4日未満なら報告不要？","a":"一律ではありません。休業1～3日は四半期ごとの報告対象ですが、不休災害は労働者死傷病報告の対象外です。"},{"q":"死亡・休業見込4日以上はいつ出す？","a":"遅滞なく提出します。人命救助・二次災害防止を最優先にし、報告は2025年1月1日から原則電子申請です。"},{"q":"休業1～3日はいつ出す？","a":"1～3月分は4月末、4～6月分は7月末、7～9月分は10月末、10～12月分は翌年1月末までです。"}],"建設業法上の技術者配置":[{"q":"請負金額だけ見れば技術者配置は決まる？","a":"いいえ。工事種類、元請・下請関係、下請総額、専任要件、特例の有無を合わせて判定します。"},{"q":"契約変更で金額が増えたら？","a":"境界額を跨いだ時点で、主任技術者・監理技術者・専任要否を再判定します。"}],"化学物質管理・SDS・ラベル":[{"q":"まずSDSだけ見ればいい？","a":"SDS確認に加え、ラベル、リスクアセスメント、ばく露低減措置、化学物質管理者や保護具着用管理責任者の要否も確認します。"},{"q":"保護具を着ければ十分？","a":"保護具だけでなく、代替、密閉化、局所排気等を含むリスク低減措置を検討します。"}],"脚立・はしご":[{"q":"脚立なら高さに関係なく自由に使っていい？","a":"いいえ。安定した設置、転位防止、天板上の立位禁止等を確認します。高さ1.5mを超える箇所では昇降設備の要否も確認します。"},{"q":"はしごは何を見ればいい？","a":"幅30cm以上、転位防止、損傷の有無、設置角度・上部固定などを確認します。"}],"足場・作業床":[{"q":"作業床の幅やすき間に基準はある？","a":"あります。代表的には幅40cm以上、床材間のすき間3cm以下などの基準を確認します。"},{"q":"手すりがあればそれだけで十分？","a":"作業床、手すり等、開口部、昇降設備、足場材の状態を一体で確認します。"}],"車両系建設機械の積卸し・移送":[{"q":"積卸しはどこでもできる？","a":"いいえ。平坦で堅固な場所を選び、道板の長さ・幅・強度・こう配を確認します。"},{"q":"誘導者は必要？","a":"周囲の状況や視界、転落・接触危険に応じて誘導体制を確認します。"}],"有機溶剤の代表物質":[{"q":"混合物でも有機溶剤則の対象になる？","a":"なり得ます。含有率や物質区分をSDS・成分表で確認し、適用要否を判定します。"},{"q":"物質名だけ見ればいい？","a":"いいえ。含有率、作業方法、換気、健診対象、保護具まで合わせて確認します。"}],"粉じん・研磨・切断":[{"q":"防じんマスクだけ着ければ十分？","a":"いいえ。発散源対策、局所排気・湿式化等を優先し、必要に応じ呼吸用保護具を併用します。"},{"q":"粉じん作業は測定が必要？","a":"対象となる作業場では作業環境測定や評価の要否を確認します。"}],"鉛・鉛作業":[{"q":"鉛を扱う作業は何を最初に確認？","a":"対象業務か、作業主任者の要否、局所排気等、健康診断、保護具を確認します。"},{"q":"設備点検は必要？","a":"対象設備について定期点検や作業開始前の確認が必要になるため、個別規定を確認します。"}],"型枠支保工":[{"q":"型枠支保工は図面なしで組んでいい？","a":"いいえ。組立図を作成し、構造・部材配置・荷重条件を確認します。"},{"q":"コンクリート打設前に何を見る？","a":"支柱、はり、緊結部、沈下・変形、組立図との一致などを確認します。"}],"プレス・シャー・回転機械":[{"q":"安全装置があれば手を入れてもいい？","a":"いいえ。危険点への接触防止、インターロック、安全ブロック等を含め、作業方法そのものを安全にします。"},{"q":"作業前に何を確認？","a":"クラッチ・ブレーキ、安全装置、非常停止、ガード、異常音・振動等を確認します。"}],"保護具":[{"q":"会社が支給した保護具なら何でも使える？","a":"いいえ。危険有害要因に適合する性能・サイズ・状態かを確認します。"},{"q":"共用で使っていい？","a":"必要数を確保し、衛生面・適合性・清潔保持を確認します。"}],"作業環境測定":[{"q":"化学物質を扱えば全員、個人ばく露測定が必須？","a":"いいえ。2026年10月1日から個人ばく露測定は作業環境測定の一部に位置付けられましたが、測定の要否・方法は対象作業場、第三管理区分等、金属アーク溶接等、リスクアセスメントでの測定実施など制度ごとに判定します。"},{"q":"個人ばく露測定は誰でもできる？","a":"対象となる法定測定では、2026年10月1日以降、作業環境測定士の登録区分や個人ばく露測定の追加講習、分析者要件等を確認する必要があります。"},{"q":"測定記録は全部3年保存？","a":"いいえ。有機溶剤等は3年が基本ですが特別有機溶剤等は30年、第三管理区分措置の粉じん測定等では7年など、対象物質・制度で異なります。"}],"重量物・人力運搬":[{"q":"何kgまでなら一人で持っていい？","a":"一律の法定上限ではありません。腰痛予防対策指針の目安として、成人男性は体重のおおむね40%以下、女性はその60%程度を参考にしつつ、機械化や複数人運搬を優先します。"},{"q":"重い物は二人なら必ず安全？","a":"いいえ。重量、形状、把持性、運搬距離、姿勢、床面、段差を確認し、必要なら機械化します。"}],"溶接・溶断・火気作業":[{"q":"火花が飛ばなければ火気許可はいらない？","a":"現場ルールや設備条件によって異なります。火気作業の定義、可燃物、ガス・危険物、作業許可条件を確認します。"},{"q":"溶接後すぐ離れていい？","a":"残火・火種・周囲温度上昇を確認し、現場ルールに応じた残火確認を行います。"}],"危険物施設の工事":[{"q":"軽微な工事なら消防への確認は不要？","a":"工事内容によって許可・届出・仮使用の要否が変わるため、自己判断せず所轄消防へ確認します。"},{"q":"危険物を抜けばすぐ火気作業できる？","a":"いいえ。残留蒸気・ガス、洗浄・換気、ガスフリー、周囲設備の隔離を確認します。"}],"自家用電気工作物":[{"q":"電気工事士がいれば手続は不要？","a":"いいえ。自家用電気工作物では、保安規程や主任技術者など電気事業法上の管理体制を別に確認します。"},{"q":"設備を変える時は何を見る？","a":"工事計画、保安規程、主任技術者、使用前自己確認等の該当要件を確認します。"}],"高圧ガス設備・配管":[{"q":"耐圧試験は必ず1.5倍？","a":"設備区分・試験媒体・適用基準によって異なります。代表値だけで判断せず、対象設備の規則・基準を確認します。"},{"q":"漏れがなければ合格？","a":"試験圧力、保持時間、媒体、判定方法、計器校正、記録のすべてを確認します。"}],"ボイラー":[{"q":"月1回だけ点検すればいい？","a":"いいえ。水面測定装置等の日常確認と、月次の定期自主検査などを区別して確認します。"},{"q":"異常が出たらすぐ再起動していい？","a":"原因が不明なまま再起動せず、燃焼停止・燃料遮断等の手順に従い原因確認を行います。"}],"第一種・第二種圧力容器":[{"q":"安全弁が付いていれば点検不要？","a":"いいえ。圧力計、安全弁、腐食、漏れ、支持部等を法定周期・使用条件に応じて確認します。"},{"q":"加圧中に増締めしてもいい？","a":"危険です。加圧状態でボルト増締めや分解を行わず、安全に圧力を抜いてから対応します。"}],"騒音・振動作業":[{"q":"85dBを超えたら違法？","a":"必ずしも一律の違法判定ではありません。ガイドライン上の管理区分やばく露時間と、個別法令・作業場規制を分けて確認します。"},{"q":"耳栓だけで対策できる？","a":"設備対策、作業時間管理、距離確保等を優先し、必要に応じて聴覚保護具を使用します。"}],"リスクアセスメント・KY":[{"q":"KYをやればリスクアセスメントをやったことになる？","a":"必ずしも同じではありません。KYは現場手法であり、法令上求められるリスクアセスメントの記録・評価・低減措置とは分けて確認します。"},{"q":"いつリスクアセスメントを見直す？","a":"設備・材料・作業方法・手順の新規導入や変更、危険有害性の変化時などに見直します。"}],"クレーン検査・点検":[{"q":"クレーンは毎日点検だけでいい？","a":"いいえ。作業開始前、月次、年次などの点検・検査を区別して確認します。"},{"q":"強風の後はそのまま使っていい？","a":"屋外クレーン等では強風後の点検要否を確認し、異常があれば使用を止めます。"}],"グラインダー・研削といし":[{"q":"といし交換後すぐ削っていい？","a":"いいえ。交換後は定められた試運転を行い、異常振動・亀裂等がないことを確認します。"},{"q":"保護カバーを外した方が作業しやすい場合は？","a":"安全装置を外して使用してはいけません。適正なカバーと作業姿勢で使用します。"}],"職長・安全衛生責任者教育":[{"q":"職長になったら自動的に教育不要？","a":"いいえ。対象業種・職務に該当する場合は所定の教育を受ける必要があります。"},{"q":"安全衛生責任者と職長は同じ？","a":"役割は異なりますが、建設現場では兼務するケースもあるため、選任と教育要件を個別に確認します。"}],"特定元方事業者の安全管理体制":[{"q":"元請なら全部の安全責任を負う？","a":"元方の調整・巡視・指導援助等の義務と、各請負人が自ら負う安全義務を分けて考えます。"},{"q":"現場巡視はどれくらい必要？","a":"建設業等では毎作業日に少なくとも1回の巡視が必要となる場面を確認します。"}],"安全衛生管理体制":[{"q":"50人以上なら全部同じ体制？","a":"いいえ。業種や人数で安全管理者、衛生管理者、産業医、委員会等の要否が変わります。"},{"q":"衛生管理者は何人必要？","a":"常時使用労働者数に応じて必要人数が増えるため、人数区分を確認します。"}],"健康診断・特殊健康診断":[{"q":"健康診断は年1回だけ？","a":"一般健診は原則年1回ですが、特定業務や有機溶剤・特化物等では6か月以内ごとなど別周期があります。"},{"q":"健診結果を受け取れば終わり？","a":"いいえ。医師意見の聴取、就業措置、記録保存まで確認します。"}],"免許・技能講習・特別教育":[{"q":"資格証を持っていれば何でもできる？","a":"いいえ。資格の対象業務・能力区分・有効範囲を確認します。"},{"q":"特別教育の記録は必要？","a":"必要です。対象業務ごとに教育記録を残し、保存します。"}],"機械等・建設工事の届出":[{"q":"88条の届出は全部30日前？","a":"いいえ。対象機械等の設置・移転・主要構造部分変更と特に大規模な建設工事は30日前ですが、一定規模以上の建設工事等には14日前の届出があります。"},{"q":"全部の設備・工事が届出対象？","a":"いいえ。安衛則第85条・別表第7、第89条、第90条や個別規則で、設備種類・能力・規模・期間・工事内容等から判定します。"},{"q":"高さ10m以上の足場なら必ず届出？","a":"つり足場・張出し足場を除く高さ10m以上の足場は代表的な対象ですが、組立てから解体まで60日未満など除外条件も確認します。"}],"騒音を伴う特定建設作業":[{"q":"85dBを超えたら即工事中止？","a":"指定地域・対象作業・規制基準・自治体運用を確認し、必要な低減措置を講じます。"},{"q":"届出はいつまで？","a":"特定建設作業に該当する場合、原則として開始7日前までの届出を確認します。"}],"振動を伴う特定建設作業":[{"q":"75dBを超えたら即違法？","a":"指定地域・対象作業・規制基準・自治体運用を確認して判断します。"},{"q":"届出はいつまで？","a":"特定建設作業に該当する場合、原則として開始7日前までの届出を確認します。"}],"車両系建設機械":[{"q":"3t未満なら無資格でいい？","a":"いいえ。対象機種では3t未満でも特別教育が必要です。"},{"q":"後退時はミラーだけ見ればいい？","a":"死角が大きい場合は誘導者・立入禁止等を含めた接触防止措置を確認します。"}],"特定化学物質":[{"q":"SDSに特化物と書いてなければ対象外？","a":"物質名・濃度・作業内容から法令適用を判定する必要があります。SDSだけの表現に頼らず確認します。"},{"q":"保護具を着ければ局排はいらない？","a":"いいえ。発散抑制・密閉・局排等を優先し、必要に応じて保護具を併用します。"}],"客先・プラント独自ルール":[{"q":"法令を守っていれば客先ルールは無視できる？","a":"いいえ。契約・入構条件として法令より厳しい現場ルールが設定されることがあります。"},{"q":"どの文書を優先する？","a":"法令を下回ることはできません。その上で、最新の客先安全基準・作業許可要領・構内ルールを確認します。"}],"有機溶剤・塗装":[{"q":"有機溶剤なら全部同じ扱い？","a":"いいえ。対象物質、含有率、作業場所、作業方法で適用が変わるためSDSと成分表から判定します。"},{"q":"換気扇があれば十分？","a":"いいえ。局所排気等の発散抑制設備、作業主任者、健診、保護具まで一体で確認します。"}],"タンク・槽内作業":[{"q":"槽内洗浄だけなら閉所扱いしなくていい？","a":"槽の構造・換気状況・残留物・流入可能性から酸欠・有機溶剤等の適用を確認します。"},{"q":"配管バルブを閉めれば縁切り完了？","a":"誤操作・漏れ・逆流を考慮し、ブラインドやLOTO等を含む確実な隔離を確認します。"}],"掘削・地山・土止め":[{"q":"地山が固そうなら土止め不要？","a":"いいえ。地質、掘削深さ、湧水、周辺荷重、亀裂等から崩壊危険を判定します。"},{"q":"大雨の翌日はそのまま作業していい？","a":"いいえ。作業開始前に加え、大雨や地震後は地山・土止めの点検を行います。"}],"作業主任者":[{"q":"経験者なら作業主任者にできる？","a":"いいえ。対象作業ごとに必要な免許・技能講習等の資格要件を確認します。"},{"q":"作業主任者を複数置いてもいい？","a":"可能ですが、職務分担を明確にして周知します。"}]};

const ARTICLE_TEXT={"墜落・高所作業":[{"n":"労働安全衛生規則 第518条","h":"作業床の設置等","s":"高さ2m以上の箇所で、墜落により危険を及ぼすおそれがある場合は、原則として作業床を設けます。困難な場合は、防網や要求性能墜落制止用器具等により墜落防止措置を講じます。"},{"n":"労働安全衛生規則 第519条","h":"作業床の端・開口部等","s":"高さ2m以上の作業床の端や開口部等には、囲い、手すり、覆い等を設けます。困難な場合等は防網や墜落制止用器具等を使用させます。"},{"n":"労働安全衛生規則 第520条","h":"労働者の使用義務","s":"事業者から要求性能墜落制止用器具等の使用を命じられた労働者は、これを使用しなければなりません。"},{"n":"労働安全衛生規則 第521条","h":"取付設備等","s":"墜落制止用器具等を使用させる場合は、安全に取り付けるための設備等を設け、器具と取付設備等の異常の有無を随時点検します。"},{"n":"労働安全衛生規則 第522条","h":"悪天候時の作業禁止","s":"高さ2m以上の箇所では、強風・大雨・大雪等により危険が予想されるときは作業を行わせません。"}],"足場・作業床":[{"n":"労働安全衛生規則 第563条","h":"作業床","s":"足場上で作業を行う場合、原則として幅40cm以上の作業床を設け、床材間の隙間は3cm以下とし、墜落防止設備を設けます。"},{"n":"労働安全衛生規則 第564条","h":"足場の組立て等の作業","s":"組立て・解体・変更の順序等を周知し、作業区域への立入禁止、悪天候時の中止、墜落防止措置、材料等の上げ下ろし時のつり綱等の使用を定めています。"},{"n":"労働安全衛生規則 第565条","h":"作業主任者","s":"法令上の対象となる足場の組立て等の作業では、足場の組立て等作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"労働安全衛生規則 第567条","h":"点検","s":"足場の組立て、一部解体、変更後等には所定事項を点検し、異常があるときは直ちに補修します。"}],"車両系建設機械":[{"n":"労働安全衛生規則 第155条","h":"作業計画","s":"車両系建設機械を使用するときは、機械の種類・能力、運行経路、作業方法を示した作業計画をあらかじめ定め、関係労働者へ周知します。"},{"n":"労働安全衛生規則 第156条","h":"制限速度","s":"最高速度10km/h以下の機械を除き、地形・地質等に応じた適正な制限速度を定め、その速度を超えて運転してはいけません。"},{"n":"労働安全衛生規則 第157条","h":"転落等の防止","s":"路肩の崩壊、地盤の不同沈下等による転倒・転落を防ぐため、路肩の誘導、幅員保持、誘導者配置等の必要な措置を講じます。"},{"n":"労働安全衛生規則 第158条","h":"接触の防止","s":"運転中の車両系建設機械に接触する危険がある箇所への立入りを禁止します。誘導者を配置し誘導させる場合は例外があります。"},{"n":"労働安全衛生規則 第160条","h":"運転位置から離れる場合の措置","s":"運転者が運転位置を離れるときは、バケット等の作業装置を地上に下ろし、原動機を止め、逸走防止措置を講じます。"}],"クレーン・移動式クレーン":[{"n":"クレーン等安全規則 第66条の2","h":"作業方法等の決定等","s":"移動式クレーンを用いる作業では、作業場所の広さ・地形・地質、荷の重量、クレーンの種類・能力等を考慮し、作業方法、転倒防止方法、労働者配置・指揮系統をあらかじめ定め、作業開始前に関係労働者へ周知します。"},{"n":"クレーン等安全規則 第66条の3","h":"外れ止め装置","s":"移動式クレーンで荷をつり上げるときは、外れ止め装置を使用します。"},{"n":"クレーン等安全規則 第68条","h":"就業制限","s":"移動式クレーンの運転資格を定めます。つり上げ荷重1t以上5t未満の小型移動式クレーンは、技能講習修了者でも運転できます。"},{"n":"クレーン等安全規則 第69条","h":"過負荷の制限","s":"移動式クレーンに定格荷重を超える荷重をかけて使用してはなりません。"},{"n":"クレーン等安全規則 第70条","h":"傾斜角の制限","s":"ジブの傾斜角は、明細書又は製造者が指定した範囲を超えて使用してはなりません。"},{"n":"クレーン等安全規則 第70条の2","h":"定格荷重の表示等","s":"運転者と玉掛け者が定格荷重を常時把握できるよう、表示その他の措置が必要です。"}],"玉掛け・吊具":[{"n":"クレーン等安全規則 第213条","h":"玉掛け用ワイヤロープの安全係数","s":"玉掛け用ワイヤロープの安全係数は6以上でなければ使用できません。"},{"n":"クレーン等安全規則 第215条","h":"不適格なワイヤロープの使用禁止","s":"素線切断10%以上、直径減少7%超、キンク、著しい形崩れ・腐食があるワイヤロープは使用できません。"},{"n":"クレーン等安全規則 第219条の2","h":"使用範囲の制限","s":"玉掛用具は定められた使用荷重等の範囲で使用します。"},{"n":"クレーン等安全規則 第220条","h":"作業開始前の点検","s":"その日の作業開始前にワイヤロープ・チェーン・ベルト・フック・シャックル等を点検します。"},{"n":"クレーン等安全規則 第221条","h":"就業制限","s":"法令上の対象となる玉掛け業務は、玉掛け技能講習修了者等でなければ従事できません。"},{"n":"クレーン等安全規則 第222条","h":"特別の教育","s":"つり上げ荷重1t未満のクレーン等の玉掛け業務では、特別教育が必要です。"}],"熱中症対策":[{"n":"労働安全衛生規則 第612条の2第1項","h":"報告体制の整備・周知","s":"熱中症を生ずるおそれのある作業を行うときは、熱中症の自覚症状がある者、または熱中症の疑いがある者を発見した者が報告できる体制をあらかじめ整備し、関係作業者に周知します。"},{"n":"労働安全衛生規則 第612条の2第2項","h":"重篤化防止手順の作成・周知","s":"作業場ごとに、作業からの離脱、身体冷却、必要に応じた医師の診察・処置等、熱中症の症状悪化を防止する措置内容と実施手順をあらかじめ定め、関係作業者へ周知します。"},{"n":"令和7年改正省令・通達","h":"対象となる作業","s":"WBGT28度以上または気温31度以上の環境下で、連続1時間以上または1日4時間を超えて実施が見込まれる作業が対象です。"}],"酸素欠乏・閉所":[{"n":"酸素欠乏症等防止規則 第3条","h":"作業環境測定","s":"酸素欠乏危険作業場では、その日の作業開始前に空気中の酸素濃度を測定します。第二種酸素欠乏危険作業場では酸素濃度に加えて硫化水素濃度も測定します。測定結果等は3年間保存します。"},{"n":"酸素欠乏症等防止規則 第4条","h":"測定器具","s":"酸素欠乏危険作業を行う場合、必要な測定器具を備えるか、容易に利用できるようにします。"},{"n":"酸素欠乏症等防止規則 第5条","h":"換気","s":"原則として酸素濃度18%以上を保つよう換気します。第二種酸素欠乏危険作業では、酸素濃度18%以上かつ硫化水素濃度10ppm以下を保ちます。"},{"n":"酸素欠乏症等防止規則 第11条","h":"作業主任者","s":"第一種・第二種の区分に応じ、所定の技能講習修了者から酸素欠乏危険作業主任者を選任します。"},{"n":"酸素欠乏症等防止規則 第13条","h":"特別教育","s":"酸素欠乏危険作業に従事させる労働者には、法令で定める特別教育を行います。"}],"脚立・はしご":[{"n":"労働安全衛生規則 第526条","h":"昇降設備","s":"高さ又は深さが1.5mを超える箇所で作業を行うときは、安全に昇降するための設備等を設けます。"},{"n":"労働安全衛生規則 第527条","h":"移動はしご","s":"丈夫な構造、著しい損傷・腐食のない材料、幅30cm以上とし、すべり止め装置の取付けその他転位を防止するための必要な措置を講じます。"},{"n":"労働安全衛生規則 第528条","h":"脚立","s":"丈夫な構造、著しい損傷・腐食のない材料、脚と水平面との角度75度以下、折りたたみ式では角度を確実に保持する金具等、作業に必要な踏み面を備えます。"}],"足場の組立て・解体":[{"n":"労働安全衛生規則 第564条","h":"組立て・解体・変更時の措置","s":"作業の時期・範囲・順序を関係労働者に周知し、関係者以外の立入禁止、悪天候時の作業中止、墜落防止措置、材料等の上げ下ろし時のつり綱等の使用を行います。"},{"n":"労働安全衛生規則 第565条","h":"足場の組立て等作業主任者","s":"法令上の対象となる足場の組立て・解体・変更作業では、技能講習修了者から作業主任者を選任します。"},{"n":"労働安全衛生規則 第566条","h":"作業主任者の職務","s":"材料・器具・工具・要求性能墜落制止用器具・保護帽等の点検、作業方法と労働者配置の決定、作業進行と保護具使用状況の監視を行わせます。"},{"n":"労働安全衛生規則 第567条","h":"足場の点検","s":"点検者を指名し、作業開始前や強風・大雨・大雪・中震以上の地震後、足場の組立て・一部解体・変更後など、法令で定める時期に点検し、異常があれば直ちに補修します。"}],"化学物質管理・SDS・ラベル":[{"n":"労働安全衛生法 第57条","h":"ラベル表示","s":"政令で定める危険有害な化学物質等を容器・包装で譲渡又は提供する場合、名称、人体に及ぼす作用、注意事項等を表示します。"},{"n":"労働安全衛生法 第57条の2","h":"SDS等による通知","s":"通知対象物を譲渡又は提供する場合、成分・含有量、危険有害性、取扱上の注意等を文書等で通知します。"},{"n":"労働安全衛生法 第57条の3","h":"リスクアセスメント","s":"通知対象物を製造又は取り扱う事業者は、危険性又は有害性等の調査を実施し、その結果に基づいて必要な措置を検討します。"},{"n":"労働安全衛生規則 第12条の5","h":"化学物質管理者","s":"リスクアセスメント対象物を製造又は取り扱う事業場ごとに化学物質管理者を選任し、表示・SDS・リスクアセスメント・ばく露低減措置・教育等の化学物質管理を担当させます。"},{"n":"労働安全衛生規則 第12条の6","h":"保護具着用管理責任者","s":"化学物質管理者を選任した事業者が、リスクアセスメント結果に基づき労働者へ保護具を使用させる場合、保護具着用管理責任者を選任し、保護具の選択・使用・保守管理を担当させます。"},{"n":"労働安全衛生規則 第35条","h":"雇入れ時等の教育","s":"労働者を雇い入れ、又は作業内容を変更したときは、機械・原材料等の危険性又は有害性や取扱方法等について安全衛生教育を行います。化学物質管理の強化に伴い、従来の一部業種に対する省略規定は削除されています。"}],"有機溶剤・塗装":[{"n":"有機溶剤中毒予防規則 第19条","h":"有機溶剤作業主任者","s":"法令上の対象となる有機溶剤業務では、有機溶剤作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"有機溶剤中毒予防規則 第29条","h":"健康診断","s":"対象業務に常時従事する労働者には、雇入れ時、配置替え時、その後6月以内ごとに1回、医師による健康診断を行います。"},{"n":"有機溶剤中毒予防規則 第30条","h":"健康診断個人票","s":"有機溶剤等健康診断個人票を作成し、5年間保存します。"},{"n":"有機溶剤中毒予防規則 第30条の2","h":"医師からの意見聴取","s":"有機溶剤等健康診断の結果に基づく医師からの意見聴取は、健康診断実施日等から3月以内に行います。"},{"n":"有機溶剤中毒予防規則 第30条の4","h":"緊急診断","s":"有機溶剤により著しく汚染され、又は多量に吸入した労働者には、速やかに医師による診察又は処置を受けさせます。"},{"n":"有機溶剤中毒予防規則 第32条～第34条","h":"呼吸用保護具","s":"所定の業務では送気マスク、有機ガス用防毒マスク等の使用、必要数、清潔保持、労働者の使用義務が定められています。"}],"特定化学物質":[{"n":"特定化学物質障害予防規則 第27条","h":"特定化学物質作業主任者等","s":"令第6条第18号の対象作業では、所定の技能講習修了者から特定化学物質作業主任者等を選任します。金属アーク溶接等作業では限定技能講習修了者から選任できる制度があります。"},{"n":"特定化学物質障害予防規則 第28条","h":"作業主任者の職務","s":"作業方法の決定・指揮、局所排気装置等の定期点検、保護具使用状況の監視等を行わせます。"},{"n":"特定化学物質障害予防規則 第37条","h":"休憩室","s":"第一類物質又は第二類物質を常時製造・取り扱う作業では、作業場以外の場所に休憩室を設けます。粉状物質の場合は入口の除去設備、衣服用ブラシ、清掃しやすい床等の措置が必要です。"},{"n":"特定化学物質障害予防規則 第39条","h":"健康診断","s":"法令上の対象業務に常時従事する労働者に対し、対象物質・業務ごとに定められた健康診断を実施します。"},{"n":"特定化学物質障害予防規則 第40条","h":"健康診断個人票","s":"特定化学物質健康診断個人票は原則5年間保存し、特別管理物質に係る一定の個人票は30年間保存します。"},{"n":"特定化学物質障害予防規則 第40条の2","h":"医師からの意見聴取","s":"健康診断実施日等から3月以内に医師の意見を聴取し、その意見を健康診断個人票に記載します。"},{"n":"特定化学物質障害予防規則 第43条～第45条","h":"保護具","s":"呼吸用保護具、不浸透性保護衣・保護手袋・保護長靴等を備え、所定の必要数を確保し、常時有効かつ清潔に保持します。"}],"溶接・溶断・火気作業":[{"n":"労働安全衛生規則 第279条","h":"危険物等がある場所における火気等の使用禁止","s":"爆発又は火災のおそれがある場所では、火花・アーク・高温となる機械等又は火気を使用してはなりません。"},{"n":"労働安全衛生規則 第286条","h":"通風等の不十分な場所での溶接等","s":"通風又は換気が不十分な場所で溶接・溶断・加熱等を行う場合、酸素を通風又は換気のために使用してはなりません。"},{"n":"労働安全衛生規則 第288条","h":"火気使用禁止の表示等","s":"火災・爆発の危険がある場所では、火気の使用を禁止し、その旨を表示する等の措置を講じます。特に危険な場所には必要のない者を立ち入らせません。"},{"n":"労働安全衛生規則 第289条","h":"消火設備","s":"危険物等を取り扱う場所には、予想される火災の性状に適した消火設備を設けます。"},{"n":"労働安全衛生規則 第291条","h":"火気使用場所の火災防止","s":"火気を使用する場所には火災予防上必要な設備を設け、火気使用後は残火の始末を確実に行います。"}],"保護具":[{"n":"労働安全衛生規則 第593条","h":"呼吸用保護具等","s":"暑熱・寒冷、有害物、ガス・蒸気・粉じん等の有害業務では、保護衣、保護眼鏡、呼吸用保護具等の適切な保護具を備えます。請負人に一部を請け負わせる場合は、保護具を使用できるよう備える必要がある旨を周知します。"},{"n":"労働安全衛生規則 第594条","h":"皮膚障害等防止用保護具","s":"皮膚・眼に障害を与える物、経皮吸収等により健康障害を生ずるおそれのある物を扱う業務では、不浸透性保護衣、保護手袋、履物、保護眼鏡等を備えます。"},{"n":"労働安全衛生規則 第594条の2","h":"皮膚等障害化学物質等","s":"対象となる皮膚等障害化学物質等を製造・取り扱う業務では、不浸透性の保護衣、保護手袋、履物又は保護眼鏡等の適切な保護具を使用させます。"},{"n":"労働安全衛生規則 第595条","h":"騒音障害防止用保護具","s":"強烈な騒音を発する場所では、耳栓その他の保護具を備えます。使用を命じた場合は、労働者が容易に知ることができるよう見やすい場所に掲示します。"},{"n":"労働安全衛生規則 第596条","h":"保護具の数等","s":"第593条、第594条、第594条の2、第595条の対象保護具は、同時就業者数と同数以上を備え、常時有効かつ清潔に保持します。"},{"n":"労働安全衛生規則 第597条","h":"労働者の使用義務","s":"事業者から必要な保護具の使用を命じられた労働者は、その保護具を使用します。"}],"フォークリフト・構内運搬":[{"n":"労働安全衛生規則 第151条の3","h":"作業計画","s":"車両系荷役運搬機械等を用いる作業では、あらかじめ作業計画を定め、その計画に従って作業します。"},{"n":"労働安全衛生規則 第151条の5","h":"制限速度","s":"作業場所の地形・地質等に応じた適正な制限速度を定め、その速度を超えて運転してはなりません。"},{"n":"労働安全衛生規則 第151条の7","h":"接触の防止","s":"運転中の車両系荷役運搬機械等に接触する危険がある箇所への立入りを禁止します。誘導者を配置して誘導する場合は例外があります。"},{"n":"労働安全衛生規則 第151条の9","h":"立入禁止","s":"フォーク等又は支持された荷の下への立入りを原則禁止します。修理・点検時に安全支柱等を使用する場合は例外があります。"},{"n":"労働安全衛生規則 第151条の11","h":"運転位置から離れる場合の措置","s":"運転者が運転位置を離れる場合、フォーク等を最低降下位置に置き、原動機を止め、逸走防止措置を講じます。"},{"n":"労働安全衛生規則 第151条の21","h":"年次定期自主検査","s":"フォークリフトは1年以内ごとに1回、定期自主検査を行います。"},{"n":"労働安全衛生規則 第151条の22","h":"月次定期自主検査","s":"フォークリフトは1月以内ごとに1回、定期自主検査を行います。"},{"n":"労働安全衛生規則 第151条の23","h":"検査記録","s":"定期自主検査の記録は3年間保存します。"},{"n":"労働安全衛生規則 第151条の24","h":"特定自主検査","s":"フォークリフトの年次定期自主検査は特定自主検査とされ、所定資格者または検査業者が実施し、検査標章を貼付します。"},{"n":"労働安全衛生規則 第151条の25","h":"作業開始前点検","s":"その日の作業開始前に、制動・操縦、荷役・油圧、車輪、灯火・方向指示器・警報装置等を点検します。"}],"クレーン検査・点検":[{"n":"クレーン等安全規則 第34条","h":"年次定期自主検査","s":"クレーンは設置後、1年以内ごとに1回、定期自主検査を行います。"},{"n":"クレーン等安全規則 第35条","h":"月次定期自主検査","s":"クレーンは1月以内ごとに1回、安全装置、ブレーキ、クラッチ、ワイヤロープ、つり具、電気設備等を自主検査します。"},{"n":"クレーン等安全規則 第36条","h":"作業開始前の点検","s":"その日の作業開始前に、巻過防止装置、ブレーキ、クラッチ、コントローラー等を点検します。"},{"n":"クレーン等安全規則 第37条","h":"暴風後等の点検","s":"屋外クレーンでは、瞬間風速30m/s超の風や中震以上の地震後、作業前に各部の異常を点検します。"},{"n":"クレーン等安全規則 第76条～第79条","h":"移動式クレーンの年次・月次・作業開始前点検","s":"移動式クレーンにも年次・月次の定期自主検査と、その日の作業開始前点検、3年間の自主検査記録保存が定められています。"}],"粉じん・研磨・切断":[{"n":"粉じん障害防止規則 第26条","h":"作業環境測定等","s":"対象となる特定粉じん作業場では、法令で定める作業環境測定を実施し、その結果を評価して必要な措置につなげます。"},{"n":"粉じん障害防止規則 第26条の2","h":"評価結果に基づく措置","s":"作業環境測定結果の評価に応じて、施設・設備・作業方法の点検、改善その他必要な措置を講じます。"},{"n":"粉じん障害防止規則 第27条第1項","h":"呼吸用保護具","s":"別表第三に掲げる作業等では、有効な呼吸用保護具を使用させます。別表第三第5号の作業では、送気マスク又は空気呼吸器に限られます。"},{"n":"粉じん障害防止規則 第27条第2項","h":"請負人への周知","s":"対象作業の一部を請負人に請け負わせる場合、必要な呼吸用保護具を使用する必要がある旨を周知する等の措置を講じます。"}],"鉛・鉛作業":[{"n":"鉛中毒予防規則 第33条","h":"鉛作業主任者","s":"法令上の対象となる鉛業務では、鉛作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"鉛中毒予防規則 第34条","h":"作業主任者の職務","s":"労働者への汚染防止指揮、著しい汚染時の速やかな除去、局所排気装置・プッシュプル型換気装置・全体換気装置・排気筒・除じん装置の毎週1回以上の点検、労働衛生保護具等の使用状況監視を行わせます。"},{"n":"鉛中毒予防規則 第34条の2","h":"請負人への周知","s":"鉛業務の一部を請負人に請け負わせる場合、身体が鉛等により著しく汚染されたときは速やかに汚染を除去する必要がある旨を周知します。"},{"n":"鉛中毒予防規則 第35条","h":"局所排気装置等の定期自主検査","s":"対象となる局所排気装置、プッシュプル型換気装置及び除じん装置は、1年以内ごとに1回、定期自主検査を行います。"}],"ボイラー":[{"n":"ボイラー及び圧力容器安全規則 第3条","h":"製造許可","s":"ボイラー（小型ボイラーを除く）を製造しようとする者は、原則として所轄都道府県労働局長の製造許可を受けます。"},{"n":"ボイラー及び圧力容器安全規則 第3条の2","h":"設計審査","s":"2026年改正で追加された設計審査制度では、登録設計審査等機関にボイラー設計審査申請書、構造図、強度計算その他の必要書類を提出し、設計審査結果証明書の交付を受けます。"},{"n":"ボイラー及び圧力容器安全規則 第25条","h":"ボイラー取扱作業主任者の職務","s":"圧力・水位・燃焼状態の監視、安全弁・水面測定装置・給水装置・自動制御装置等の管理を行わせます。水面測定装置の機能は1日に1回以上点検します。"},{"n":"ボイラー及び圧力容器安全規則 第31条","h":"吹出し","s":"一人で同時に2以上のボイラーの吹出しを行わず、吹出し中は他の作業を行いません。"},{"n":"ボイラー及び圧力容器安全規則 第32条","h":"定期自主検査","s":"ボイラーは使用開始後1月以内ごとに1回、本体、燃焼装置、自動制御装置、附属装置・附属品について自主検査します。"}],"第一種・第二種圧力容器":[{"n":"ボイラー及び圧力容器安全規則 第67条","h":"第一種圧力容器の定期自主検査","s":"第一種圧力容器は、使用開始後1月以内ごとに1回、本体、ふたの締付けボルト、管・弁等について定期自主検査を行います。"},{"n":"ボイラー及び圧力容器安全規則 第86条","h":"第二種圧力容器の安全弁","s":"安全弁は最高使用圧力以下で作動するよう調整します。安全弁が2個以上ある場合、1個を最高使用圧力以下で作動するよう調整すれば、他の安全弁は最高使用圧力の3％増以下で作動するよう調整できます。"},{"n":"ボイラー及び圧力容器安全規則 第87条","h":"圧力計の防護・表示","s":"圧力計内部が凍結又は80℃以上にならない措置を講じ、目盛には最高使用圧力を示す位置を見やすく表示します。"},{"n":"ボイラー及び圧力容器安全規則 第88条","h":"第二種圧力容器の定期自主検査","s":"第二種圧力容器は、使用開始後1年以内ごとに1回、本体、ふたの締付けボルト、管・弁等を自主検査し、その結果を3年間保存します。"},{"n":"ボイラー及び圧力容器安全規則 第89条","h":"補修等","s":"第88条の自主検査で異常を認めた場合は、補修その他の必要な措置を講じます。"}],"掘削・地山・土止め":[{"n":"労働安全衛生規則 第355条","h":"地山の調査","s":"地山の掘削作業を行うときは、あらかじめ形状、地質、地層、き裂、含水・湧水、埋設物等の状態を調査し、その結果に適応する掘削時期・順序を定めます。"},{"n":"労働安全衛生規則 第358条","h":"点検","s":"点検者を指名し、作業開始前、大雨後、中震以上の地震後等に、地山のき裂、浮石、含水、湧水等の変化を点検します。"},{"n":"労働安全衛生規則 第359条","h":"作業主任者の選任","s":"高さ2m以上の地山の掘削作業では、地山の掘削及び土止め支保工作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"労働安全衛生規則 第360条","h":"作業主任者の職務","s":"作業方法と労働者配置の決定・直接指揮、器具工具の点検、墜落制止用器具等・保護帽の使用状況監視を行わせます。"},{"n":"労働安全衛生規則 第361条","h":"崩壊等による危険の防止","s":"地山の崩壊や土石落下のおそれがある場合は、土止め支保工、防護網、立入禁止等の必要な措置を講じます。"}],"型枠支保工":[{"n":"労働安全衛生規則 第240条","h":"組立図","s":"型枠支保工を組み立てるときは組立図を作成し、その図により組み立てます。"},{"n":"労働安全衛生規則 第244条","h":"コンクリート打設時の点検","s":"その日の作業開始前に型枠支保工を点検し、異常があれば補修します。作業中の異常時に作業を中止できる措置も必要です。"},{"n":"労働安全衛生規則 第245条","h":"組立て・解体時の措置","s":"関係者以外の立入禁止、悪天候時の作業中止、材料等の上げ下ろし時のつり綱等の使用を定めています。"},{"n":"労働安全衛生規則 第246条","h":"作業主任者の選任","s":"対象作業では、型枠支保工の組立て等作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"労働安全衛生規則 第247条","h":"作業主任者の職務","s":"作業方法の決定・直接指揮、材料・器具工具の点検、墜落制止用器具等・保護帽の使用状況監視を行わせます。"}],"労働者死傷病報告":[{"n":"労働安全衛生規則 第97条","h":"労働者死傷病報告","s":"労働災害等により労働者が死亡または休業した場合、所轄労働基準監督署長へ報告します。死亡または休業4日以上は遅滞なく、休業4日未満は四半期ごとに報告します。"},{"n":"令和7年1月1日施行 改正労働安全衛生規則","h":"電子申請の義務化","s":"2025年1月1日から労働者死傷病報告は原則として電子申請が義務化されました。電子申請が困難な場合は、当分の間、書面での報告も可能です。"},{"n":"同改正","h":"報告事項の見直し","s":"事業の種類、被災者の職種、傷病名、災害発生状況・原因等の一部について、コード選択や記入欄の細分化など報告様式が見直されました。"}],"タンク・槽内作業":[{"n":"酸素欠乏症等防止規則 第3条","h":"作業開始前測定","s":"酸素欠乏危険場所に該当するタンク・槽内では、その日の作業開始前に酸素濃度を測定し、第二種酸素欠乏危険場所では硫化水素濃度も測定します。"},{"n":"酸素欠乏症等防止規則 第5条","h":"換気","s":"原則として酸素濃度18%以上を保つよう換気します。第二種酸素欠乏危険作業では、酸素18%以上かつ硫化水素10ppm以下を維持します。"},{"n":"酸素欠乏症等防止規則 第11条","h":"作業主任者","s":"第一種・第二種の区分に応じ、所定の技能講習修了者から酸素欠乏危険作業主任者を選任します。"},{"n":"有機溶剤中毒予防規則 第19条","h":"有機溶剤作業主任者","s":"タンク等内部で法令上の対象となる有機溶剤業務を行う場合、有機溶剤作業主任者を選任します。"},{"n":"有機溶剤中毒予防規則 第32条～第34条","h":"呼吸用保護具","s":"対象となるタンク等内部の有機溶剤業務では、送気マスク等の呼吸用保護具を使用させます。"}],"停電・活線・感電防止":[{"n":"労働安全衛生規則 第339条","h":"停電作業","s":"電路を開路して電気工事を行う場合、開閉器への施錠・通電禁止表示又は監視人配置、残留電荷の放電、高圧・特別高圧では検電による停電確認と短絡接地を行います。"},{"n":"労働安全衛生規則 第341条","h":"高圧活線作業","s":"高圧の充電電路を取り扱う作業では、絶縁用保護具・絶縁用防具、活線作業用器具又は活線作業用装置等を用いて感電防止措置を講じます。"},{"n":"労働安全衛生規則 第342条","h":"高圧活線近接作業","s":"高圧充電電路に接近する作業では、接近限界に応じ、絶縁用防具の装着、絶縁用保護具の着用等により感電を防止します。"},{"n":"労働安全衛生規則 第350条","h":"作業指揮者","s":"停電作業・高圧活線作業等では、作業期間・内容・電路系統を労働者へ周知し、作業指揮者を定め、作業方法・順序の周知と直接指揮、停電・施錠・表示・接地状態等の確認を行わせます。"},{"n":"労働安全衛生規則 第351条","h":"絶縁用保護具等の定期自主検査","s":"対象となる絶縁用保護具等は6月以内ごとに1回、絶縁性能について自主検査し、記録を3年間保存します。"},{"n":"労働安全衛生規則 第353条","h":"囲い等の点検","s":"電気機械器具の囲い・絶縁覆いは毎月1回以上、損傷の有無を点検し、異常があれば直ちに補修します。"}],"産業廃棄物・マニフェスト":[{"n":"廃棄物処理法 第12条の3","h":"産業廃棄物管理票","s":"産業廃棄物の運搬又は処分を委託する場合、排出事業者は管理票（マニフェスト）を交付し、運搬・処分の終了を確認します。"},{"n":"廃棄物処理法 第12条の3第5項・第7項","h":"返送確認・未返送時の措置","s":"通常の産業廃棄物は交付から90日、特別管理産業廃棄物は60日以内に所定の写しが返送されない場合、速やかに処理状況を把握し必要な措置を講じ、所定期限内に都道府県知事等へ報告します。最終処分終了確認には180日の期限があります。"},{"n":"廃棄物処理法施行規則 第8条の20・第8条の21","h":"交付方法・記載事項","s":"マニフェストの交付方法、交付年月日、排出事業場、運搬・処分受託者、廃棄物の種類・数量、最終処分場所等の記載事項を定めています。"},{"n":"産業廃棄物管理票交付等状況報告","h":"年度報告","s":"紙マニフェストを交付した排出事業者は、事業場ごとに前年度の交付状況をまとめ、毎年6月30日までに管轄の都道府県知事等へ報告します。電子マニフェスト分は情報処理センターが報告するため、排出事業者による同報告は不要です。"}],"プレス・シャー・回転機械":[{"n":"労働安全衛生規則 第131条","h":"プレス等による危険の防止","s":"プレス機械・シャーでは、安全囲い、安全装置等により身体の一部が危険限界に入らないよう措置します。"},{"n":"労働安全衛生規則 第131条の2","h":"スライド下降による危険の防止","s":"動力プレスの金型取付け、取外し又は調整で身体の一部が危険限界に入る場合、安全ブロックを使用させる等、スライドの不意な下降による危険を防止する措置を講じます。"},{"n":"労働安全衛生規則 第131条の3","h":"金型の調整","s":"金型調整のためスライドを作動させる場合、寸動機構があるものは寸動、ないものは手回しで行います。"},{"n":"労働安全衛生規則 第132条","h":"クラッチ等の機能保持","s":"クラッチ、ブレーキその他制御に必要な部分の機能を常に有効な状態に保持します。"},{"n":"労働安全衛生規則 第133条","h":"プレス機械作業主任者","s":"労働安全衛生法施行令第6条第7号に該当する作業では、プレス機械作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"労働安全衛生規則 第134条","h":"作業主任者の職務","s":"プレス機械・安全装置の点検、異常時措置、切替えキースイッチのキー保管、金型の取付け・取外し・調整の直接指揮等を行わせます。"},{"n":"労働安全衛生規則 第136条","h":"作業開始前の点検","s":"プレス等を用いて作業を行うときは、その日の作業開始前に法令で定める事項を点検します。"}],"特定元方事業者の安全管理体制":[{"n":"労働安全衛生法 第29条","h":"元方事業者の指導等","s":"元方事業者は、関係請負人等が労働安全衛生法令に違反しないよう必要な指導を行い、違反を認めた場合は是正のため必要な指示を行います。"},{"n":"労働安全衛生法 第29条の2","h":"建設業元方事業者の技術上の指導等","s":"土砂崩壊や機械転倒等のおそれのある場所では、関係請負人が危険防止措置を適切に実施するための技術上の指導その他必要な措置を行います。"},{"n":"労働安全衛生法 第30条","h":"特定元方事業者の措置","s":"混在作業による労働災害を防止するため、協議組織の設置・運営、作業間の連絡調整、作業場所の巡視、安全衛生教育への指導援助等を実施します。"},{"n":"労働安全衛生規則 第637条","h":"作業場所の巡視","s":"特定元方事業者による作業場所の巡視は、毎作業日に少なくとも1回行います。"},{"n":"労働安全衛生規則 第638条","h":"安全衛生教育への指導・援助","s":"関係請負人が行う安全衛生教育への指導・援助として、教育場所の提供、教育資料の提供等の措置を講じます。"},{"n":"労働安全衛生規則 第638条の2","h":"工程・設備配置計画の対象業種","s":"安衛法第30条第1項第5号の厚生労働省令で定める業種は建設業です。"},{"n":"労働安全衛生規則 第664条","h":"作業開始後の報告","s":"所定の特定元方事業者は、その労働者と関係請負人の作業従事者の作業が同一場所で行われる場合、作業開始後遅滞なく、事業種類・名称・所在地等を所轄労働基準監督署長へ報告します。"}],"作業環境測定":[{"n":"労働安全衛生法 第65条","h":"作業環境測定","s":"政令で定める有害業務の作業場では、厚生労働省令に従って必要な作業環境測定を行い、その結果を記録します。"},{"n":"労働安全衛生法 第65条の3","h":"個人ばく露測定等","s":"2026年10月1日施行の改正で、個人ばく露測定が作業環境測定の一部として位置付けられました。省令で定める場合等には、個人ばく露測定等を法令上の方法・実施者要件に従って行います。"},{"n":"作業環境測定法 第3条","h":"指定作業場の測定実施者","s":"指定作業場について作業環境測定を行う場合は、作業環境測定士に実施させるか、作業環境測定機関等へ委託します。"},{"n":"作業環境測定法 第4条","h":"測定基準","s":"作業環境測定士・測定機関等は、労働安全衛生法に基づく作業環境測定基準に従って測定します。"},{"n":"作業環境測定法施行令 第1条等","h":"指定作業場・個人ばく露測定","s":"2026年10月1日施行の改正で、安衛法第65条の3に基づく一定の個人ばく露測定等を行う作業場について、作業環境測定士等による実施が必要となる範囲が整備されました。"},{"n":"作業環境測定法施行規則 第3条の4等","h":"個人ばく露測定の精度確保","s":"2026年10月1日施行の改正で、一定の個人ばく露測定について、サンプリング・分析の実施者要件等が整備されました。"}],"健康診断・特殊健康診断":[{"n":"労働安全衛生規則 第43条","h":"雇入時の健康診断","s":"常時使用する労働者を雇い入れるときは、法令で定める項目について医師による健康診断を行います。"},{"n":"労働安全衛生規則 第44条","h":"定期健康診断","s":"常時使用する労働者に対し、1年以内ごとに1回、法令で定める項目について定期健康診断を実施します。"},{"n":"労働安全衛生規則 第45条","h":"特定業務従事者の健康診断","s":"深夜業など法令で定める特定業務に常時従事する労働者には、配置替えの際及び6月以内ごとに1回、健康診断を実施します。胸部エックス線検査は1年以内ごとに1回で足りる場合があります。"},{"n":"労働安全衛生規則 第51条","h":"健康診断個人票の保存","s":"一般健康診断等の結果に基づき健康診断個人票を作成し、5年間保存します。"},{"n":"労働安全衛生規則 第51条の2","h":"医師等からの意見聴取","s":"一般健康診断等の結果に基づく医師又は歯科医師からの意見聴取は、原則として健康診断実施日等から3月以内に行います。"},{"n":"有機溶剤中毒予防規則 第29条・第30条・第30条の2","h":"有機溶剤健康診断","s":"対象業務に常時従事する労働者には、雇入れ時、配置替え時、その後6月以内ごとに1回の健康診断を行い、個人票は5年間保存、医師の意見聴取は3月以内に行います。"},{"n":"特定化学物質障害予防規則 第39条・第40条・第40条の2","h":"特定化学物質健康診断","s":"対象業務に常時従事する労働者には、対象物質・業務ごとに法令で定める健康診断を行います。個人票は原則5年間保存し、特別管理物質に係る一定の個人票は30年間保存します。医師の意見聴取は3月以内です。"}],"リスクアセスメント・KY":[{"n":"労働安全衛生法 第28条の2","h":"危険性又は有害性等の調査等","s":"建設物、設備、原材料、作業行動等に起因する危険性・有害性を調査し、その結果に基づいて必要な措置を講ずるよう努めます。"},{"n":"労働安全衛生規則 第24条の11第1号","h":"建設物の変更等","s":"建設物を設置、移転、変更又は解体するときにリスクアセスメントを実施します。"},{"n":"労働安全衛生規則 第24条の11第2号","h":"設備・原材料の新規採用等","s":"設備、原材料等を新規に採用し、又は変更するときに実施します。"},{"n":"労働安全衛生規則 第24条の11第3号","h":"作業方法・手順の変更等","s":"作業方法又は作業手順を新規に採用し、又は変更するときに実施します。"},{"n":"労働安全衛生規則 第24条の11第4号","h":"その他危険性・有害性の変化","s":"建設物、設備、原材料、ガス、蒸気、粉じん、作業行動等による危険性・有害性に変化が生じ、又は生ずるおそれがあるときに実施します。"},{"n":"労働安全衛生法 第57条の3","h":"化学物質リスクアセスメント","s":"通知対象物を製造又は取り扱う事業者には、化学物質による危険性又は有害性等の調査が義務付けられています。"}],"重量物・人力運搬":[{"n":"職場における腰痛予防対策指針","h":"重量物取扱い作業","s":"重量物の取扱いは自動化・省力化を原則とし、人力作業が残る場合は重量、作業速度、姿勢、回数、人員配置等を調整して腰部への負担を軽減します。"},{"n":"同指針 別紙Ⅰ 2","h":"人力による取扱い重量","s":"満18歳以上の男性が人力のみで取り扱う重量は、体重のおおむね40％以下となるよう努めます。女性はさらにその60％程度までとされています。"},{"n":"同指針 別紙Ⅰ 2(2)","h":"重量超過時の措置","s":"上記重量を超える重量物では、まず自動化・補助機器の使用を検討し、困難な場合は身長差の少ない2人以上で均等に負担して作業します。"}],"有機溶剤の代表物質":[{"n":"有機溶剤中毒予防規則 第1条","h":"第一種・第二種・第三種有機溶剤等","s":"有機溶剤等を第一種・第二種・第三種に区分し、作業場所や作業内容に応じて換気、作業主任者、保護具、健康診断等の規制を適用します。"},{"n":"有機溶剤中毒予防規則 第1条第1項第2号","h":"有機溶剤含有物","s":"有機溶剤と他の物との混合物で、有機溶剤を重量の5％を超えて含有するものは『有機溶剤含有物』に該当します。"},{"n":"有機溶剤中毒予防規則 別表（第29条関係）","h":"代表的な健康診断対象物質","s":"キシレン、トルエン、N,N-ジメチルホルムアミド、ノルマルヘキサン等について、物質ごとの検査項目が定められています。"}],"騒音・振動作業":[{"n":"騒音障害防止のためのガイドライン（令和5年4月改訂）","h":"管理区分","s":"作業環境測定等の結果を85dB未満、85dB以上90dB未満、90dB以上の区分で評価し、設備改善、作業方法改善、聴覚保護具等の対策を講じます。"},{"n":"同ガイドライン 別紙1","h":"測定時間・記録","s":"定常作業時に1測定点10分間以上継続して測定し、定点測定結果等は3年間保存します。"},{"n":"同ガイドライン 第8","h":"騒音健康診断","s":"騒音作業に常時従事する労働者について、雇入れ時又は配置替え時の健康診断に加え、原則として6月以内ごとに1回の定期健康診断を行います。"},{"n":"同ガイドライン 許容基準表","h":"等価騒音レベルと1日のばく露時間","s":"参考となる許容基準では、85dBで8時間、88dBで4時間、91dBで2時間、94dBで1時間など、騒音レベルが高くなるほど許容ばく露時間が短くなります。"},{"n":"振動障害予防対策指針","h":"日振動ばく露量A(8)","s":"周波数補正振動加速度実効値の3軸合成値と1日のばく露時間からA(8)を算出し、限界値5.0m/s²以下となるよう管理します。A(8)が2.5m/s²を超える場合は、ばく露時間抑制や低振動工具の選定等に努めます。"}],"建設業法上の技術者配置":[{"n":"建設業法 第26条","h":"主任技術者・監理技術者","s":"建設業者は、建設工事を施工するときは原則として主任技術者を置き、元請として一定額以上の下請契約を締結する特定建設業者は監理技術者を置きます。"},{"n":"建設業法施行令 第2条","h":"監理技術者配置に関する下請金額要件","s":"発注者から直接請け負った元請が施工のため締結する下請契約額の合計が5,000万円以上（建築工事業は8,000万円以上）の場合、特定建設業許可および監理技術者配置等の要件に関係します。金額は税込で判定します。"},{"n":"建設業法施行令 第27条","h":"専任を要する建設工事","s":"公共性のある施設・工作物等に関する重要な建設工事で、請負代金額が4,500万円以上（建築一式工事は9,000万円以上）の場合、原則として主任技術者又は監理技術者の専任が必要です。"},{"n":"監理技術者制度運用マニュアル","h":"令和7年2月1日改正","s":"上記金額要件は令和7年2月1日から改正後の金額が適用されています。専任義務には情報通信技術活用等による例外・兼任制度があるため、個別条件の確認が必要です。"}],"客先・プラント独自ルール":[{"n":"現場固有ルール","h":"法令とは別管理","s":"客先・発注者・元請・各プラントで定める入構、火気、KY、ロックアウト、保護具、作業許可、持込機器点検等のルールは、法令そのものではありません。法令・社内規程・客先ルールを分けて登録・表示する設計とします。"},{"n":"労働安全衛生法 第29条・第30条","h":"元方事業者等の安全管理との関係","s":"元方事業者の指導や特定元方事業者の統括管理に基づき、現場固有ルールが設定されることがありますが、個々のルール内容は現場文書で確認する必要があります。"}],"危険物施設の工事":[{"n":"消防法 第10条第4項","h":"位置・構造・設備の技術上の基準","s":"製造所、貯蔵所又は取扱所の位置・構造・設備は、政令で定める技術上の基準に適合させる必要があります。"},{"n":"消防法 第11条第1項","h":"設置・変更許可","s":"危険物施設を設置するとき、または位置・構造・設備を変更するときは、原則として市町村長等の許可を受けます。"},{"n":"消防法 第11条第5項","h":"完成検査","s":"許可を受けた危険物施設は、完成後に完成検査を受け、基準適合が確認される前は原則として使用できません。"},{"n":"消防法 第11条の4","h":"品名・数量・指定数量倍数の変更届","s":"位置・構造・設備を変更せず、危険物の品名、数量又は指定数量の倍数を変更する場合は、変更日の10日前までに届け出ます。"}],"グラインダー・研削といし":[{"n":"労働安全衛生法 第59条第3項","h":"特別教育","s":"危険又は有害な業務で省令に定めるものに労働者を就かせるときは、その業務に関する特別教育を行う必要があります。"},{"n":"労働安全衛生規則 第36条第1号","h":"研削といしの取替え等","s":"研削といしの取替え、または取替え時の試運転の業務は特別教育の対象です。"},{"n":"労働安全衛生規則 第118条","h":"試運転","s":"研削といしは、その日の作業開始前に1分間以上、取り替えたときは3分間以上の試運転を行います。"},{"n":"労働安全衛生規則 第119条","h":"最高使用周速度","s":"研削といしは、その最高使用周速度を超えて使用してはなりません。"},{"n":"労働安全衛生規則 第38条","h":"特別教育記録の保存","s":"特別教育を実施したときは、受講者、科目等の記録を作成し、3年間保存します。"}],"作業主任者":[{"n":"労働安全衛生法 第14条","h":"作業主任者の選任","s":"政令で定める一定の危険・有害作業では、免許を受けた者又は技能講習修了者等から作業主任者を選任し、作業を直接指揮させるなど所定の職務を行わせます。"},{"n":"労働安全衛生法施行令 第6条","h":"選任対象作業","s":"ボイラー取扱い、ガス溶接、地山掘削、型枠支保工、足場、有機溶剤、特定化学物質、鉛、酸素欠乏危険作業など、作業主任者を選任すべき作業を定めています。"},{"n":"労働安全衛生規則 第16条","h":"氏名・職務の周知","s":"作業主任者を選任したときは、その氏名と職務を作業場の見やすい箇所への掲示等により関係労働者へ周知します。"},{"n":"労働安全衛生規則 第17条","h":"複数選任時の職務分担","s":"同一場所で複数の作業主任者を選任する場合は、それぞれの職務の分担を定めます。"},{"n":"個別規則・個別条文","h":"作業ごとの具体要件","s":"実際の選任要否・資格・職務は各作業の個別規則で確認します。例として、地山掘削、型枠支保工、足場、有機溶剤、特定化学物質、酸素欠乏危険作業等があります。"}],"機械等・建設工事の届出":[{"n":"労働安全衛生法 第88条第1項","h":"機械等の設置等に係る計画届","s":"省令で定める機械等を設置・移転し、または主要構造部分を変更しようとするときは、原則として工事開始日の30日前までに所轄労働基準監督署長へ届け出ます。"},{"n":"労働安全衛生規則 第85条","h":"届出対象","s":"法第88条第1項の対象機械等は、安衛則別表第7その他の規定で定められます。設備名称だけでなく、能力・規模・有害物質の種類等の条件確認が必要です。"},{"n":"労働安全衛生規則 別表第7","h":"対象機械・設備","s":"一定の機械設備、有害物質関係設備等について、計画届の対象となる設備区分・要件を定めています。"},{"n":"関連通達","h":"届出図書・対象範囲","s":"届出対象範囲や図面・計算書等の提出図書について、通達で具体的な取扱いが示されています。"}],"石綿・解体改修":[{"n":"石綿障害予防規則 第3条","h":"事前調査","s":"建築物・工作物・鋼製船舶の解体又は改修を行う場合、原則として設計図書等の文書確認と目視確認により、石綿含有建材の有無を事前調査します。不明な場合は分析調査等で確認します。"},{"n":"石綿障害予防規則 第4条","h":"作業計画","s":"石綿を含む建材等の除去等を行う場合、作業方法・順序、粉じん発散防止、労働者のばく露防止方法等をあらかじめ定めます。"},{"n":"石綿障害予防規則 第4条の2","h":"事前調査結果の報告","s":"一定規模以上の建築物・工作物の解体・改修では、石綿の有無にかかわらず事前調査結果の報告が必要です。"},{"n":"石綿障害予防規則 関係規定","h":"事前調査結果の記録・掲示","s":"事前調査結果の記録を作成して3年間保存し、作業場所に備え付けるとともに、調査結果の概要を見やすい箇所に掲示します。"},{"n":"2026年1月1日施行の改正","h":"工作物の事前調査者資格","s":"一定の工作物の解体・改修に係る事前調査について、2026年1月1日から資格を有する者に行わせる要件が適用されています。"}],"職長・安全衛生責任者教育":[{"n":"労働安全衛生法 第60条","h":"職長等の教育","s":"政令で定める業種の事業場で、新たに職務につく職長その他の作業中の労働者を直接指導・監督する者に対し、安全衛生教育を実施します。作業主任者は除かれます。"},{"n":"労働安全衛生規則 第40条","h":"教育内容・時間","s":"作業手順・配置、指導監督、リスクアセスメント、異常時措置、現場監督者としての労災防止活動について、合計12時間以上の教育を行います。"},{"n":"労働安全衛生法 第16条","h":"安全衛生責任者","s":"特定元方事業者が統括管理する現場で、関係請負人は安全衛生責任者を選任し、統括安全衛生責任者との連絡等を行わせます。"}],"安全衛生管理体制":[{"n":"労働安全衛生法 第10条・労働安全衛生法施行令 第2条","h":"総括安全衛生管理者","s":"業種と常時使用労働者数に応じて選任します。林業・鉱業・建設業・運送業・清掃業は100人以上、製造業・電気業・ガス業等は300人以上、その他の業種は1,000人以上が基本です。"},{"n":"労働安全衛生法 第11条・労働安全衛生法施行令 第3条","h":"安全管理者","s":"法令で定める工業的業種等で、常時50人以上の労働者を使用する事業場では安全管理者を選任します。"},{"n":"労働安全衛生法 第12条・労働安全衛生法施行令 第4条","h":"衛生管理者","s":"業種を問わず、常時50人以上の労働者を使用する事業場では衛生管理者を選任します。必要人数は事業場規模に応じて増加します。"},{"n":"労働安全衛生法 第12条の2・労働安全衛生規則 第12条の2、第12条の3","h":"安全衛生推進者・衛生推進者","s":"常時10人以上50人未満の事業場では、業種に応じて安全衛生推進者又は衛生推進者を選任します。選任すべき事由が発生した日から14日以内に選任し、氏名を関係労働者へ周知します。"},{"n":"労働安全衛生法 第13条・労働安全衛生法施行令 第5条","h":"産業医","s":"常時50人以上の労働者を使用する事業場では産業医を選任します。常時1,000人以上、又は法定の有害業務に常時500人以上を従事させる事業場では専属産業医が必要です。"},{"n":"労働安全衛生規則 第13条","h":"産業医の人数","s":"常時3,000人を超える労働者を使用する事業場では、産業医を2人以上選任します。"},{"n":"労働安全衛生規則 第7条等","h":"衛生管理者の人数","s":"常時50人以上200人以下は1人以上、200人超500人以下は2人以上、500人超1,000人以下は3人以上、1,000人超2,000人以下は4人以上、2,000人超3,000人以下は5人以上、3,000人超は6人以上を選任します。"},{"n":"労働安全衛生法 第17条～第19条・労働安全衛生法施行令 第8条、第9条","h":"安全委員会・衛生委員会","s":"衛生委員会は全業種で常時50人以上が基本です。安全委員会は業種により常時50人以上又は100人以上で設置します。"}],"車両系建設機械の積卸し・移送":[{"n":"労働安全衛生規則 第161条","h":"車両系建設機械の移送","s":"自走またはけん引により貨物自動車等へ積卸しを行う場合、積卸しは平たんで堅固な場所で行い、道板は十分な長さ・幅・強度を有し、適当な勾配で確実に取り付けます。盛土・仮設台等を使用する場合も十分な幅・強度・適度な勾配を確保します。"},{"n":"労働安全衛生規則 第162条","h":"搭乗の制限","s":"車両系建設機械で作業を行うとき、作業従事者を乗車席以外の箇所に乗せてはなりません。"},{"n":"労働安全衛生規則 第163条","h":"使用の制限","s":"転倒や作業装置の破壊による危険を防止するため、機械の構造上定められた安定度、最大使用荷重等を守ります。"}],"自家用電気工作物":[{"n":"電気事業法 第42条","h":"保安規程","s":"自家用電気工作物を設置する者は、工事・維持・運用に関する保安を確保するため保安規程を定め、使用開始前に経済産業大臣へ届け出ます。変更時も届出が必要です。"},{"n":"電気事業法 第43条","h":"主任技術者","s":"事業用電気工作物を設置する者は、工事・維持・運用に関する保安の監督をさせるため、原則として主任技術者を選任します。外部委託承認制度等の例外は別途要件確認が必要です。"},{"n":"電気事業法 第44条","h":"主任技術者免状","s":"主任技術者免状の種類・交付等を定めています。設備区分、電圧、選任方法等に応じ、必要資格と監督範囲を確認します。"}],"高圧ガス設備・配管":[{"n":"一般高圧ガス保安規則 第6条等","h":"製造施設等の技術基準","s":"高圧ガス設備・配管等について、材料、構造、強度、耐圧試験、気密試験その他の技術基準を定めています。設備区分・ガス種・圧力条件等により適用条項が異なります。"},{"n":"一般高圧ガス保安規則の例示基準","h":"耐圧試験","s":"一般的な例示基準では、液体による耐圧試験圧力は常用圧力の1.5倍以上、気体による場合は1.25倍以上とし、規定圧力保持時間は5～20分間を標準とします。第二種特定設備等には別の倍率が適用される場合があります。"},{"n":"同例示基準","h":"気密試験","s":"高圧ガス設備等は、原則として常用圧力以上の圧力で気密試験を行い、漏えいがないことを確認します。"},{"n":"同例示基準","h":"気圧耐圧試験時の安全措置","s":"気体による耐圧試験では、段階的に昇圧し、試験従事者を必要最小限とし、防護・退避を考慮するなど、液圧試験より慎重な安全措置が必要です。"}],"騒音を伴う特定建設作業":[{"n":"騒音規制法 第14条","h":"特定建設作業の届出","s":"指定地域内で特定建設作業を伴う建設工事を施工しようとする者は、原則として作業開始日の7日前までに市町村長へ届け出ます。届出義務者は原則として元請負人です。"},{"n":"騒音規制法施行令 別表第二","h":"対象となる特定建設作業","s":"くい打機、びょう打機、さく岩機、空気圧縮機、コンクリートプラント等、政令で定める作業が対象です。"},{"n":"特定建設作業に伴って発生する騒音の規制に関する基準","h":"敷地境界での騒音基準","s":"特定建設作業の場所の敷地境界線において、85dBを超えないことが基準です。"},{"n":"同基準 第2号～第5号","h":"作業時間・期間・休日","s":"第1号区域では原則19時～翌7時、第2号区域では原則22時～翌6時の作業を行わず、1日当たり第1号区域10時間以内・第2号区域14時間以内、連続6日以内、日曜その他休日は原則作業しない基準があります。"}],"振動を伴う特定建設作業":[{"n":"振動規制法 第14条","h":"特定建設作業の届出","s":"指定地域内で特定建設作業を伴う建設工事を施工しようとする者は、原則として作業開始日の7日前までに市町村長へ届け出ます。緊急に実施する必要がある場合は速やかに届け出ます。"},{"n":"振動規制法施行令 別表第二","h":"対象となる特定建設作業","s":"くい打機、鋼球を用いる破壊作業、舗装版破砕機、ブレーカー等、政令で定める作業が対象です。"},{"n":"振動規制法施行規則 第11条等","h":"振動の規制基準","s":"特定建設作業の場所の敷地境界線において、75dBを超えないことが基準です。"},{"n":"同規制基準","h":"作業時間・期間・休日","s":"第1号区域では原則19時～翌7時、第2号区域では原則22時～翌6時の作業を行わず、1日当たり第1号区域10時間以内・第2号区域14時間以内、連続6日以内、日曜その他休日は原則作業しない基準があります。"}],"免許・技能講習・特別教育":[{"n":"労働安全衛生法 第61条・労働安全衛生法施行令 第20条","h":"就業制限","s":"一定の危険・有害業務では、免許を受けた者、技能講習を修了した者その他法令で定める資格者でなければ業務に就かせることができません。"},{"n":"労働安全衛生規則 第36条","h":"特別教育","s":"就業制限の対象より小さい能力・荷重区分等の業務でも、法令で定める危険有害業務については特別教育が必要です。"},{"n":"フォークリフト","h":"最大荷重1トンが境界","s":"最大荷重1トン以上のフォークリフト運転は技能講習修了等が必要です。1トン未満は特別教育の対象です。道路上の走行運転は別に道路交通法上の運転免許等を確認します。"},{"n":"車両系建設機械","h":"機体重量3トンが境界","s":"整地・運搬・積込み・掘削用等では、機体重量3トン以上は技能講習、3トン未満は特別教育が基本です。機械の種類により別区分があるため、用途を確認します。"},{"n":"移動式クレーン","h":"1トン・5トンが境界","s":"つり上げ荷重5トン以上は移動式クレーン運転士免許、1トン以上5トン未満は小型移動式クレーン運転技能講習、1トン未満は特別教育が基本です。"},{"n":"玉掛け","h":"つり上げ荷重等1トンが境界","s":"つり上げ荷重1トン以上のクレーン等の玉掛け業務は玉掛け技能講習修了者等、1トン未満は特別教育修了者が対象です。"}]};

function compactArticleRefs(items){
  const groups=new Map();
  (items||[]).forEach(raw=>{
    const t=String(raw||"").trim();
    const m=t.match(/^(.*?)\s+(第.+)$/);
    const law=m?m[1].trim():"";
    const art=m?m[2].trim():t;
    if(!groups.has(law))groups.set(law,[]);
    groups.get(law).push(art);
  });

  return [...groups.entries()].map(([law,arts])=>{
    // Consecutive simple article numbers -> one compact range.
    const nums=arts.map(a=>{
      const m=a.match(/^第(\d+)条$/);
      return m?Number(m[1]):null;
    });
    let refs="";
    if(nums.length>=2 && nums.every(v=>v!==null) && nums.every((v,i)=>i===0||v===nums[i-1]+1)){
      refs=`第${nums[0]}条～第${nums[nums.length-1]}条`;
    }else{
      refs=arts.join("・");
    }
    return {law,refs};
  });
}

  }

}

function kataToHira(v){
  return String(v||"").replace(/[\u30a1-\u30f6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
}
function normKana(v){return norm(kataToHira(v))}
function allSuggestionItems(){
  const out=[];
  const seen=new Set();
  const add=(label,value,kind)=>{
    const key=`${kind}|${label}`;
    if(!label||seen.has(key))return;
    seen.add(key);
    out.push({label,value:value||label,kind});
  };
  DATA.forEach(x=>{
    add(x.law,x.law,"法令");
    add(x.title,x.title,"テーマ");
    (x.kw||[]).forEach(k=>add(k,k,"関連ワード"));
    (x.articles||[]).forEach(a=>add(`${x.law} ${a}`,`${x.law} ${a}`,"条文"));
    (ARTICLE_TEXT[x.title]||[]).forEach(a=>{
      add(`${x.law} ${a.n}`,`${x.law} ${a.n}`,"条文");
      if(a.h)add(`${a.n} ${a.h}`,`${a.n} ${a.h}`,"条文");
    });
    (ORIGINAL_TEXT[x.title]||[]).forEach(o=>{
      add(`${x.law} ${o.n}`,`${x.law} ${o.n}`,"条文");
    });
    if(CURRENT_RULES[x.title]){
      add(`${x.title} 現行基準`,x.title,"関連ワード");
      add(`${x.title} 改正確認`,x.title,"関連ワード");
    }
  });
  SEARCH_ALIASES.forEach(x=>{
    const key=`${x.kind}|${x.label}|${x.a}`;
    if(!seen.has(key)){
      seen.add(key);
      out.push({label:x.label,value:x.value||x.label,kind:x.kind,alias:x.a});
    }
  });
  return out;
}
const SUGGESTION_ITEMS=allSuggestionItems();

function positionSuggestions(){}
function showSuggestions(){
  const box=document.getElementById("suggestions");
  const t=norm(q.value);
  if(!t){box.hidden=true;box.innerHTML="";return}
  const rank={"法令":0,"条文":1,"テーマ":2,"関連ワード":3};
  const tq=normKana(q.value);
  const scored=[];
  for(const it of SUGGESTION_ITEMS){
    const label=normKana(it.label);
    const alias=normKana(it.alias||"");
    let match=99;
    if(alias&&alias.startsWith(tq)) match=0;
    else if(label.startsWith(tq)) match=1;
    else if(alias&&alias.includes(tq)) match=2;
    else if(label.includes(tq)) match=3;
    else continue;
    scored.push({it,match,kindRank:rank[it.kind]??9});
  }
  scored.sort((a,b)=>a.match-b.match||a.kindRank-b.kindRank||a.it.label.length-b.it.label.length||a.it.label.localeCompare(b.it.label,"ja"));
  const dedup=[],seenLabels=new Set();
  for(const x of scored){
    const k=`${x.it.kind}|${x.it.label}`;
    if(seenLabels.has(k))continue;
    seenLabels.add(k);dedup.push(x.it);
    if(dedup.length>=12)break;
  }
  const hits=dedup;
  if(!hits.length){box.hidden=true;box.innerHTML="";return}
  box.innerHTML=hits.map((it,i)=>`<button type="button" class="suggestionItem" data-idx="${i}"><span class="suggestKind">${it.kind}</span><span class="suggestLabel">${it.label}</span></button>`).join("");
  box.querySelectorAll(".suggestionItem").forEach((btn,i)=>{
    btn.addEventListener("click",()=>{
      pickSuggestion(hits[i].value);
    });
  });
  box.hidden=false;
}
function hideSuggestions(){
  const box=document.getElementById("suggestions");

}

}

function filterArticleIndex(){
  const q=(document.getElementById("articleIndexInput")?.value||"").trim().replace(/\s+/g,"");
  const normalized=q&&!q.includes("第")?`第${q.replace(/条$/,"")}条`:q;
  document.querySelectorAll(".articleindexrow").forEach(el=>{
    const a=el.dataset.article||"";
    const plain=a.replace(/^第/,"").replace("条","").replace("の","-");
    const qplain=q.replace(/^第/,"").replace("条","").replace("の","-");
    el.style.display=(!q || a.includes(q) || a.includes(normalized) || plain.includes(qplain))?"block":"none";
  });
}

function csvEscape(v){
  const s=String(v??"");
  return `"${s.replace(/"/g,'""')}"`;
}
function exportQualityCsv(){
  const headers=EXPORT_POLICY.fields;
  const rows=DATA.map(x=>{
    const v=verificationStatus(x).filter(r=>r[1]).length;
    const priority=reviewPriorityFor(x.title)[0];
    return [
      x.title,
      priority,
      `${v}/5`,
      (CURRENT_RULES[x.title]?.items?.length || CURRENT_RULES[x.title]?.checked)?"有":"未",
      SOURCE_SETS[x.title]?.length?"有":"未",
      APPLICABILITY_GUIDES[x.title]?.length?"有":"未",
      DEADLINE_GUIDES[x.title]?.length?"有":"未",
      PERIODIC_GUIDES[x.title]?.length?"有":"未",
      RECORD_GUIDES[x.title]?.length?"有":"未",
      EMERGENCY_GUIDES[x.title]?.length?"有":"未",
      DOCUMENT_GUIDES[x.title]?.length?"有":"未",
      CONTACT_GUIDES[x.title]?.length?"有":"未"
    ];
  });
  const csv="\ufeff"+[headers,...rows].map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`safety-law-navi-quality-${APP_GOVERNANCE.version}-${APP_GOVERNANCE.reviewed}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function _shareMetric(v){
  if(typeof v==="string")return v;
  if(!v||typeof v!=="object")return String(v??"");
  if(v.label)return `${v.label}：${v.value||v.text||v.note||""}`;
  return Object.values(v).filter(Boolean).join(" / ");
}
function buildThemeShareText(x){
  const arts=(ARTICLE_TEXT[x.title]||[]).slice(0,4).map(v=>`${v.n||""} ${v.t||""}`.trim()).join("\n");

  const dec=(DECISION_GUIDES[x.title]||[]).slice(0,3).map(v=>{
    if(typeof v==="string")return `・${v}`;
    const left=v.item||v.work||v.condition||v.target||"";
    const right=v.judge||v.result||v.requirement||v.need||v.qualification||"";

  }).join("\n");
  const checked=(CURRENT_RULES[x.title]?.checked)||APP_GOVERNANCE.reviewed;
  return `【安全法令ナビ テーマレビュー】
テーマ：${x.title}

${arts||"（詳細画面で確認）"}

${x.desc||""}

${metrics||"（該当なし／詳細画面で確認）"}

■ 適用条件
${app||"（詳細画面で確認）"}

■ 資格・選任
${dec||"（詳細画面で確認）"}

■ 一次資料
${x.source||"（詳細画面で確認）"}

function quickDecisionFlow(x){
  const rows=[];
  (APPLICABILITY_GUIDES[x.title]||[]).forEach(v=>{
    rows.push({
      q:v.check,
      yes:v.if_yes,
      no:v.if_no,
      note:v.note||"",
      type:"適用判定"
    });
  });
  (DECISION_GUIDES[x.title]||[]).slice(0,5).forEach(v=>{
    if(typeof v==="string"){
      rows.push({q:v,yes:"該当する場合は詳細要件を確認",no:"非該当側の条件を確認",note:"",type:"資格・選任"});
      return;
    }
    const q=v.item||v.work||v.condition||v.target||v.question||"条件を確認";
    const yes=v.judge||v.result||v.requirement||v.need||v.qualification||"該当要件を確認";
    const no=v.no||v.otherwise||"非該当側の条件・別制度の適用を確認";
    const note=v.note||"";
    rows.push({q,yes,no,note,type:"資格・選任"});
  });
  return rows;
}

function coverageFor(x){
  const dims=[
    ["適用判定",!!APPLICABILITY_GUIDES[x.title]?.length],
    ["資格・選任",!!DECISION_GUIDES[x.title]?.length],
    ["期限",!!DEADLINE_GUIDES[x.title]?.length],
    ["点検周期",!!PERIODIC_GUIDES[x.title]?.length],
    ["記録保存",!!RECORD_GUIDES[x.title]?.length],
    ["作業前管理",!!CONTROL_GUIDES[x.title]?.length],
    ["緊急時",!!EMERGENCY_GUIDES[x.title]?.length],
    ["責任分担",!!RESPONSIBILITY_GUIDES[x.title]?.length],
    ["法的位置付け",!!LEGAL_STATUS_GUIDES[x.title]?.length],
    ["教育・講習",!!TRAINING_GUIDES[x.title]?.length],
    ["必要書類",!!DOCUMENT_GUIDES[x.title]?.length],
    ["提出先",!!CONTACT_GUIDES[x.title]?.length],
    ["FAQ",!!QUESTION_GUIDES[x.title]?.length]
  ];
  return {dims,count:dims.filter(v=>v[1]).length,total:dims.length};
}
function coverageLabel(x){

}

function fieldDetailLayout(){
  const root=document.querySelector("#detail");
  if(!root)return;

  const sections=[...root.querySelectorAll(".section")];
  const txt=sec=>(sec.querySelector("h3")?.textContent||"").trim();
  const find=(...words)=>sections.find(sec=>words.some(w=>txt(sec).includes(w)));

  // Rename titles to plain field language.
  const renames=[
    [["規制値・基準値・期限"],"重要な数値・基準"],
    [["30秒判定フロー"],"判定フロー"],
    [["よくある判断質問"],"実務判断・具体例"],
    [["必要書類・証憑チェック"],"作業前・提出時に確認する書類"],
    [["適用条件・境界・例外チェック"],"対象になる条件・ならない条件"],
    [["現場で確認するポイント"],"作業前の重要確認"],
    [["根拠・確認状況"],"根拠・更新確認"],

    [["誤り・改正を報告"],"誤り・改正の報告 ※送付先未設定"]
  ];
  sections.forEach(sec=>{
    const h=sec.querySelector("h3"); if(!h)return;
    renames.forEach(([keys,label])=>{if(keys.some(k=>h.textContent.includes(k)))h.textContent=label});
  });

  // Remove UI-only/noisy sections from detail view.
  sections.forEach(sec=>{
    const h=txt(sec);
    if(h.includes("このテーマで使える実務ガイド") ||
       h.includes("誰が何を確認するか") ||
       h.includes("誰が何をするのか") ||
       h.includes("その他関連条文")){
      sec.remove();
    }
  });

  // Merge "field points" into the practical pre-work block when both exist.
  const live=[...root.querySelectorAll(".section")];
  const get=(...words)=>live.find(sec=>words.some(w=>(sec.querySelector("h3")?.textContent||"").includes(w)));
  const field=get("作業前の重要確認","現場で確認するポイント");
